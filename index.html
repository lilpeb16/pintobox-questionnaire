<style>
/* The page around the slides follows light or dark mode. The slides are always paper, like a projected deck,
   so every brand colour is judged on the same white. */
:root{
  --page:#E4E7E2; --bar:#FFFFFF; --barink:#16302F; --barmute:#5B6B68; --barline:#D5DBD5; --barchip:#F1F3EF;
  --ui:'PB IBM Plex Sans','IBM Plex Sans','PB IBM Plex Sans Thai','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'PB IBM Plex Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --dis:'PB Archivo','Archivo','PB IBM Plex Sans','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0F1615; --bar:#18211F; --barink:#E7EEEC; --barmute:#9FB0AC; --barline:#2C3936; --barchip:#212C2A; color-scheme:dark}}
:root[data-theme="dark"]{--page:#0F1615; --bar:#18211F; --barink:#E7EEEC; --barmute:#9FB0AC; --barline:#2C3936; --barchip:#212C2A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--barink);font-family:var(--ui);font-size:15px;line-height:1.5;overflow:hidden}
body.flowmode{overflow:auto}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #1F5E5B;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* deck frame */
.deck{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.vp{min-height:0;overflow:auto;display:grid;place-items:center;padding:12px}
.holder{position:relative}
.stage{width:1280px;height:720px;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(10,30,28,.14);
  --ink:#16302F; --teal:#1F5E5B; --brass:#C08A2E; --chili:#B33A1A; --paper:#F4F5F2; --panel:#FFFFFF; --line:#DCE1DC; --mute:#5B6B68;
  --chip:#EEF1EC; --soft:#E6EAE5; --sel:#16302F; --selink:#FFFFFF; --gold:#C08A2E; --okay:#2F6E45; --warn:#B33A1A; --r:12px;
  background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;color-scheme:light}
.deck.flow{position:static;display:block}
.flow .vp{display:block;padding:0;overflow:visible}
.flow .stage{width:auto;height:auto;border-radius:0;box-shadow:none;overflow:visible}

/* slide template */
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:30px 44px 14px}
.flow .slide{position:static;padding:22px 16px 16px;min-height:calc(100vh - 120px)}
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:end}
.sh .kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);grid-column:1/-1}
.sh h2{font-family:var(--dis);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sh h2 small{font-family:'PB IBM Plex Sans Thai','IBM Plex Sans Thai',sans-serif;font-weight:400;font-size:.5em;color:var(--mute);margin-left:12px;letter-spacing:0}
.sh .lead{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:15px;max-width:110ch}
.sh .side{align-self:end}
.flow .sh{grid-template-columns:1fr}
.flow .sh h2{font-size:26px}
.sb{min-height:0;position:relative}
.sf{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#8A9693;border-top:1px solid var(--line);padding-top:7px}
.sf b{font-weight:500;color:var(--teal)}
.src{font-family:var(--mono);font-size:10.5px;color:#7C8A87;line-height:1.4;margin-top:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.th{font-family:'PB IBM Plex Sans Thai','IBM Plex Sans Thai','PB IBM Plex Sans','IBM Plex Sans',sans-serif}
.mute{color:var(--mute)}
h3,h4{margin:0}

/* grids, fixed columns on the slide and single columns on a phone */
.grid{display:grid;gap:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.c7{grid-template-columns:repeat(7,minmax(0,1fr))}
.flow .c3,.flow .c2{grid-template-columns:1fr}
.flow .c4,.flow .c5,.flow .c6,.flow .c7{grid-template-columns:repeat(2,minmax(0,1fr))}

/* cards and pick bars */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.locked{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 50%,transparent)}
.card .body{padding:10px 12px 10px;display:grid;gap:4px;flex:1;align-content:start}
.card .name{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:400}
.card .desc{font-size:12.5px;color:var(--mute);margin:0}
.stagesvg{display:block;width:100%;height:auto}
.pk{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--line);background:var(--chip)}
.pk .me-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:500;min-height:30px}
.pk .me-btn[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.pk .who{display:flex;gap:3px;flex:1;flex-wrap:wrap;min-width:0}
.pk .who .dot{min-width:22px;height:19px;padding:0 5px;border-radius:999px;font-size:9.5px;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.pk .star{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 9px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;color:var(--mute);min-height:30px}
.pk .star svg{width:13px;height:13px}
.pk .star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipopt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 6px 5px 14px;font-size:14px}
.chipopt.locked{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.chipopt .pk{border:0;background:none;padding:0;gap:4px}
.chipopt small{color:var(--mute);font-size:12px}
.note{font-size:12.5px;color:var(--mute);background:var(--chip);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:10px 0 0}
.vbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;margin:0 2px 0 0}
.vbtn[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* cover and how-to */
.cover{position:absolute;inset:0;padding:54px 64px 40px;display:grid;grid-template-rows:auto 1fr auto;background:#16302F;color:#F4F5F2;overflow:hidden}
.flow .cover{position:static;min-height:calc(100vh - 120px);padding:28px 18px}
.cover .kick{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C08A2E}
.cover h1{font-family:var(--dis);font-weight:800;font-size:66px;line-height:1.02;letter-spacing:-.025em;margin:22px 0 0;max-width:15ch}
.flow .cover h1{font-size:38px}
.cover p{font-size:18px;color:#B9C9C5;margin:18px 0 0;max-width:60ch}
.cover .icons{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.cover .icons svg{border-radius:14px}
.cover .foot{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#8FA8A2;border-top:1px solid #2C4A47;padding-top:12px;margin-top:22px;flex-wrap:wrap}
.cover .th{color:#C08A2E}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.flow .steps{grid-template-columns:1fr}
.stp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:8px;align-content:start}
.stp .n{font-family:var(--dis);font-weight:800;font-size:30px;color:var(--brass);line-height:1}
.stp b{font-size:19px}
.stp p{margin:0;color:var(--mute);font-size:15px}
.bigme{display:flex;gap:8px;flex-wrap:wrap}
.bigme button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;min-height:40px}
.bigme button[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.order{display:flex;gap:3px;min-height:96px}
.order .seg{flex-basis:0;min-width:64px;border-radius:8px;background:var(--soft);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;text-decoration:none;color:var(--ink);border:0;cursor:pointer;text-align:left}
.order .seg b{font-size:14px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.order .seg span{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.order .seg.done{background:color-mix(in srgb,var(--gold) 26%,var(--soft))}
.flow .order{flex-wrap:wrap}.flow .order .seg{flex:1 1 calc(33% - 3px)!important;min-height:48px}

/* other brands */
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.bcard .bh{display:flex;gap:10px;align-items:center}
.bcard .bh .sw{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bcard .bh .sw.none{background:var(--chip);display:grid;place-items:center;font:500 11px var(--mono);color:var(--mute)}
.bcard h3{font-family:var(--dis);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.bcard .where{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.04em}
.bcard dl{margin:0;display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 10px;font-size:13.5px}
.bcard dt{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:2px}

function icon(name,style,c,label){
  const inner=I[name]||'';
  const sw={line:1.75,bold:2.6,fine:1.15,duo:1.75,square:1.9,round:1.8,sketch:1.9,sticker:1.9}[style];
  const g=(col,w,extra)=>`<g fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${extra||''}>${inner}</g>`;
  const a=` role="img" aria-label="${esc(label||name)}"`;
  switch(style){
    case 'duo': return `<svg viewBox="0 0 24 24"${a}><circle cx="15" cy="15" r="7.5" fill="${c.a}" opacity=".5"/>${g(c.d,sw)}</svg>`;
    case 'square': return `<svg viewBox="-4.5 -4.5 33 33"${a}><rect x="-4.5" y="-4.5" width="33" height="33" rx="8.5" fill="${c.p}"/>${g(textOn(c.p),sw)}</svg>`;
    case 'round': return `<svg viewBox="-4.5 -4.5 33 33"${a}><circle cx="12" cy="12" r="16.5" fill="${c.l}"/>${g(c.d,sw)}</svg>`;
    case 'sketch': return `<svg viewBox="-1 -1 26 26"${a}>${g(c.d,sw,' filter="url(#rough)"')}</svg>`;
    case 'sticker': return `<svg viewBox="-4 -4 32 32"${a}><rect x="-4" y="-4" width="32" height="32" rx="10" fill="${c.a}"/>${g('#FFFFFF',5.2)}${g(c.d,sw)}</svg>`;
    default: return `<svg viewBox="0 0 24 24"${a}>${g(c.d,sw)}</svg>`;
  }
}

function burst(c){let pts=[];for(let i=0;i<32;i++){const r=i%2?27:40,an=Math.PI*2*i/32-Math.PI/2;pts.push((80+r*Math.cos(an)).toFixed(1)+','+(50+r*Math.sin(an)).toFixed(1))}
  return `<polygon points="${pts.join(' ')}" fill="${c.a}"/><text x="80" y="58" text-anchor="middle" font-family="'PB Kanit',Kanit,sans-serif" font-weight="700" font-size="22" fill="${textOn(c.a)}">ใหม่!</text>`}
function pennants(c){let s=`<path d="M8 22 Q80 44 152 22" fill="none" stroke="${c.d}" stroke-width="2"/>`;
  for(let i=0;i<6;i++){const x=18+i*24,t=(x-8)/144,y=(1-t)*(1-t)*22+2*(1-t)*t*44+t*t*22;s+=`<path d="M${x-10} ${(y-2).toFixed(1)} L${x+10} ${(y-2).toFixed(1)} L${x} ${(y+24).toFixed(1)} Z" fill="${i%2?c.a:c.p}"/>`}
  return s}

 ['job','Your work','อาชีพ',[['office','Office worker','พนักงานออฟฟิศ'],['business','Own business','ธุรกิจส่วนตัว'],['freelance','Freelance','ฟรีแลนซ์'],['student','Student','นักเรียน นักศึกษา'],['health','Health or fitness','สุขภาพหรือฟิตเนส'],['food','Food or restaurant','อาหารหรือร้านอาหาร'],['notworking','Not working now','ยังไม่ได้ทำงาน'],['other','Other','อื่นๆ']],'jobtext','Your work in your own words, you can skip this','อาชีพของคุณ ไม่ตอบก็ได้']
];
let CUSTOM=null;
function setCustom(hex){const r=ramp(hex);const at=st=>{const x=r.find(y=>y.step===st);return x?x.hex:hex};CUSTOM={id:'custom',name:'Your colour · สีของคุณ',th:'',p:hex.toUpperCase(),d:at(900),a:'#C9A44A',a2:'#C9A44A',l:at(50)}}
const VIEW={listStyle:null,pal:null};
const arr=(doc,set)=>(S[doc]&&Array.isArray(S[doc][set]))?S[doc][set]:[];
function tally(set){const t={};PEOPLE.forEach(p=>arr(p.id,set).forEach(o=>{t[o]=(t[o]||0)+1}));return t}
function resolve(set,fallback,n){n=n||1;const f=arr('final',set).slice(0,n);if(f.length)return f;const t=tally(set);const top=Object.keys(t).sort((a,b)=>t[b]-t[a]).slice(0,n);return top.length?top:fallback.slice(0,n)}
const byId=(list,id)=>list.find(x=>x.id===id)||list[0];
const colours=(P,N)=>({p:P.p,d:P.d,a:P.a,a2:P.a2||P.a,l:P.l,ink:N.ink,paper:N.bg,mute:N.mute,line:N.line});
function current(){const P=(VIEW.pal==='custom'&&CUSTOM)?CUSTOM:byId(PALETTES,VIEW.pal||resolve('palette',['p4'])[0]);const N=byId(NEUTRALS,resolve('neutral',['n1'])[0]);const F=byId(FONTS,resolve('font',['kanit'])[0]);return {P,N,F,c:colours(P,N)}}
const locked=(set,opt)=>arr('final',set).includes(opt)?' locked':'';
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="currentColor"/></svg>';
function pk(set,opt,compact){
  const mine=arr(ME,set).includes(opt);
  const lab=compact?(mine?'✓':'+'):(mine?'✓ Picked · เลือกแล้ว':'Pick · เลือก');
  return `<div class="pk" data-set="${set}" data-opt="${opt}"><button type="button" class="me-btn" data-act="pick" aria-pressed="${mine}" aria-label="${mine?'Picked':'Pick'}">${lab}</button></div>`;
}
const card=(set,id,top,name,desc,extra,compact)=>`<div class="card${locked(set,id)}">${top}<div class="body"><div class="name">${name}</div>${desc?`<p class="desc">${desc}</p>`:''}${extra||''}</div>${pk(set,id,compact)}</div>`;
const thsmall=t=>` <small class="th mute" style="font-weight:400">${t}</small>`;
const secDone=id=>id==='hello'?!!((S.about||{}).age||(S.about||{}).gender):Object.keys(SETS).some(k=>SETS[k].sec===id&&arr(ME,k).length>0);
const meButtons=()=>PEOPLE.map(p=>`<button type="button" data-me="${p.id}" aria-pressed="${p.id===ME}"><i class="dot" style="background:${p.col}"></i>${esc(p.name)}</button>`).join('');

/* ---------- logos ---------- */
const LTYPE={combo:'Symbol and name',letter:'Letter mark',emblem:'Emblem',word:'Lettering',mascot:'Character'};
const r300=hex=>{const r=ramp(hex);const s=r.find(x=>x.step===300);return s?s.hex:hex};
function lmap(c,mode,ground){
  if(mode==='rev')return {D:'#FFFFFF',P:r300(c.p),A:c.a,L:c.d,G:ground||c.d};
  if(mode==='ink')return {D:'#2E2419',P:'#2E2419',A:'#2E2419',L:'#FFFFFF',G:'#FFFFFF'};
  return {D:c.d,P:c.p,A:c.a,L:c.l,G:ground||c.paper};
}
const lpaint=(svg,m)=>svg.replace(/\{([DPALG])\}/g,(_,k)=>m[k]);
function lsvg(o,m,h,filter){const inner=lpaint(o.svg,m);return `<svg viewBox="0 0 ${o.vb[0]} ${o.vb[1]}" style="height:${h}px;width:auto;max-width:100%;display:block" role="img" aria-label="Logo">${filter?`<g filter="url(#${filter})">${inner}</g>`:inner}</svg>`}
function licon(L,c,size){return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${esc(L.name)} app icon" style="display:block;flex:none">${lpaint(L.icon,lmap(c,'pos'))}</svg>`}
function friendPose(c,kind){const base=friendArt(c);
  if(kind==='wave')return base+`<path d="M82 60L94 42" stroke="${c.d}" stroke-width="7" stroke-linecap="round"/><circle cx="95" cy="39" r="5" fill="${c.d}"/>`;
  if(kind==='sleep')return base+`<circle cx="38" cy="43.8" r="4.6" fill="${c.d}"/><circle cx="62" cy="43.8" r="4.6" fill="${c.d}"/><path d="M33.5 43q4.5 3.5 9 0M57.5 43q4.5 3.5 9 0" fill="none" stroke="${c.l}" stroke-width="2.4" stroke-linecap="round"/><text x="80" y="22" font-family="'PB Kanit','Kanit',sans-serif" font-weight="700" font-size="14" fill="${c.p}">z</text><text x="89" y="12" font-family="'PB Kanit','Kanit',sans-serif" font-weight="700" font-size="10" fill="${c.p}">z</text>`;
  if(kind==='sign')return base+`<path d="M90 92V40" stroke="${c.d}" stroke-width="3.5" stroke-linecap="round"/><rect x="72" y="22" width="36" height="22" rx="5" fill="${c.a}"/><text x="90" y="38" text-anchor="middle" font-family="'PB Kanit','Kanit',sans-serif" font-weight="700" font-size="12" fill="${textOn(c.a)}">ใหม่</text>`;
  return base}
function friendArt(c){const L=LOGOS.find(l=>l.id==='k10');return lpaint(L.mark.svg,{D:c.d,P:c.p,A:c.a,L:c.l,G:c.l})}
const aspect=L=>L.lock.vb[0]/L.lock.vb[1];
const lh=(L,wide,mid,tall)=>{const a=aspect(L);return a>3?wide:a>1.6?mid:tall};
function phone(L,c){const apps=[];for(let k=0;k<16;k++)apps.push(k===5?`<span class="ap">${licon(L,c,24)}<span>PintoBox</span></span>`:`<span class="ap"><i></i><span>&nbsp;</span></span>`);return `<div class="phone" aria-hidden="true"><div class="scr">${apps.join('')}</div></div>`}
const palPick=cur=>`<div class="palpick" role="group" aria-label="Show the logos in a palette"><span class="lbl">Show in · ดูในสี</span>${PALETTES.map(p=>`<button type="button" data-pal="${p.id}" aria-pressed="${cur.P.id===p.id}" title="${esc(p.name)}" aria-label="${esc(p.name)}" style="background:linear-gradient(90deg,${p.d} 50%,${p.p} 50%)"></button>`).join('')}<label class="pcol" title="Any colour"><input type="color" data-custom value="${CUSTOM?CUSTOM.p:'#2F6E62'}" aria-label="Any colour"><span>Any colour · สีอื่น</span></label><span class="mono" style="font-size:11.5px;color:var(--mute)">${esc(cur.P.name)}</span></div>`;

const add=s=>{DECK.push(s);return DECK.length-1};

add({sec:'hello',intro:true,cover:true,title:'PintoBox',body:cur=>{const c=cur.c;return `<div class="cover"><div class="art" aria-hidden="true">${(()=>{const L=LOGOS.find(l=>l.id==='k8');return lsvg(L.mark,{D:'#C08A2E',P:'#2C6A64',A:'#C08A2E',L:'#16302F',G:'#16302F'},360)})()}</div><div><div class="kick">PintoBox · Brand questionnaire · แบบสอบถามแบรนด์</div><h1>Help us choose how PintoBox looks</h1><p class="th" style="font-size:24px;color:#E7EEEC;margin-top:12px">ช่วยเราเลือกหน้าตาของ PintoBox</p><p>Pick the logo, colours, fonts and words you like. Every page has a box for your comment. Press Send on the last page.</p><p class="th">เลือกโลโก้ สี ฟอนต์ และคำที่คุณชอบ ทุกหน้ามีช่องให้เขียนความคิดเห็น แล้วกดส่งในหน้าสุดท้าย</p><div style="margin-top:22px"><button type="button" class="btn start" data-go="1">Start · เริ่มเลย</button></div></div><div style="display:grid;align-content:end"><div class="kick" style="color:#8FA8A2;margin-bottom:12px">Eleven logo ideas inside · ไอเดียโลโก้ 11 แบบ</div><div class="icons">${LOGOS.map(L=>licon(L,c,56)).join('')}</div></div><div class="foot"><span>Next is at the bottom of the screen · ปุ่มถัดไปอยู่ด้านล่าง</span><span>${DECK.length} pages · หน้า</span></div></div>`}});

add({sec:'hello',title:'What PintoBox is',th:'PintoBox คืออะไร',body:cur=>{const c=cur.c;
  const st=[['search','Find','ค้นหา','Kitchens in Bangkok that cook healthy meal plans, all in one place.','ครัวอาหารสุขภาพในกรุงเทพฯ ที่ทำแผนอาหาร รวมไว้ในที่เดียว'],['calendar','Compare and subscribe','เปรียบเทียบและสมัคร','Compare the plans and prices. Then subscribe to the plan you like.','เปรียบเทียบแผนและราคา แล้วสมัครแผนที่คุณชอบ'],['scooter','Delivered on your days','ส่งถึงตามวันในแผน','Your meals come to your home or office on the days in your plan.','อาหารส่งถึงบ้านหรือที่ทำงาน ตามวันในแผนของคุณ']];
  return `<div class="what"><div><p class="big">PintoBox is one place to find, compare and subscribe to healthy meal plans from many small kitchens.</p><p class="big th">PintoBox คือที่เดียวที่คุณหา เปรียบเทียบ และสมัครแผนอาหารสุขภาพ จากครัวเล็กๆ หลายร้าน</p><div class="name"><b>Where the name comes from · ที่มาของชื่อ</b><p>A ปิ่นโต (pinto) is the Thai food carrier with stacked tiers. People in Thailand used to pay a home kitchen to fill their pinto with meals every day. This is called ผูกปิ่นโต. PintoBox brings this habit to your phone.</p><p class="th">ปิ่นโตคือภาชนะใส่อาหารแบบซ้อนชั้น คนไทยเคยจ้างครัวให้ทำอาหารใส่ปิ่นโตส่งให้ทุกวัน เรียกว่า ผูกปิ่นโต PintoBox นำวิธีนี้มาไว้ในโทรศัพท์ของคุณ</p></div></div><div class="wr">${st.map(([ic,en,th,d,dth],i)=>`<div class="wst"><span class="wi">${icon(ic,'round',c,en)}</span><div><b>${i+1}. ${en}<small class="th">${th}</small></b><p>${d}</p><p class="th">${dth}</p></div></div>`).join('')}<div class="why"><b>Why we ask you · ทำไมเราถามคุณ</b><p>We have not chosen our logo, colours or voice yet. Your picks help us choose.</p><p class="th">เรายังไม่ได้เลือกโลโก้ สี และน้ำเสียงของแบรนด์ คำตอบของคุณจะช่วยเราเลือก</p></div></div></div>`}});

add({sec:'hello',title:'Food apps in Thailand today',th:'แอปสั่งอาหารในไทยตอนนี้',body:()=>{
  const A=[['GrabFood','#00B14F','G','Running · ใช้งานอยู่','Food delivery from restaurants. One of the two biggest apps.','ส่งอาหารจากร้าน หนึ่งในสองแอปที่ใหญ่ที่สุด',0],['LINE MAN','#0DC863','L','Running · ใช้งานอยู่','Food delivery from restaurants. The other of the two biggest apps.','ส่งอาหารจากร้าน อีกหนึ่งในสองแอปที่ใหญ่ที่สุด',0],['ShopeeFood','#8A9693','S','Running in June 2026 · ใช้งานอยู่','Food delivery inside the Shopee app.','ส่งอาหารในแอป Shopee',0],['Robinhood','#8A9693','R','Running in June 2026 · ใช้งานอยู่','A Thai food delivery app.','แอปส่งอาหารของไทย',0],['Bolt','#8A9693','B','Rides only · เรียกรถเท่านั้น','Bolt gives rides in Thailand. In August 2026 Bolt said food delivery in Thailand is still at the study stage.','Bolt มีบริการเรียกรถในไทย เดือนสิงหาคม 2569 Bolt บอกว่าการส่งอาหารในไทยยังอยู่ในขั้นศึกษา',1],['foodpanda','#8A9693','f','Closed · ปิดแล้ว','foodpanda closed in Thailand on 23 May 2025.','foodpanda ปิดบริการในไทยเมื่อ 23 พฤษภาคม 2568',1]];

  return `<div class="lone"><div class="left"><div class="hero" style="background:${N.bg}">${lsvg(L.lock,lmap(c,'pos',N.bg),lh(L,104,160,230))}</div><div class="pair"><div style="background:${c.d}"><span class="lab" style="color:${r300(c.p)}">On deep green</span>${lsvg(L.lock,lmap(c,'rev',c.d),lh(L,48,80,118))}</div><div class="kraft"><span class="lab" style="color:#5A4128">Printed on a kraft box</span><div class="lid">${lsvg(L.lock,lmap(c,'ink'),lh(L,40,70,104),'stamp')}</div></div></div></div><div class="right"><div class="idea"><div class="num">Idea ${i+1} · ${LTYPE[L.type]}</div><p>${esc(L.story)}</p><p class="th" style="font-size:13.5px;color:var(--mute)">${LSTORY_TH[L.id]||''}</p><div class="meta"><span class="tag">Lettering in ${esc(L.font)}</span><span class="tag">Drawn for PintoBox</span></div></div><div class="showcase">${phone(L,c)}<div class="sizes"><div class="lbl">App icon at three sizes</div><div class="row">${licon(L,c,64)}${licon(L,c,40)}${licon(L,c,24)}</div><div class="lbl">Small, at the top of a web page</div><div style="background:${N.bg};border:1px solid ${N.line};border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px">${lsvg(L.lock,lmap(c,'pos',N.bg),lh(L,20,30,38))}<span style="display:flex;gap:6px;font-size:9px;color:${N.mute}"><span>Plans</span><span>Kitchens</span></span></div></div></div><div class="vars"><div><span class="lbl">The symbol alone</span><div class="vbox" style="background:${N.bg}">${lsvg(L.mark,lmap(c,'pos',N.bg),66)}</div></div><div><span class="lbl">Profile picture</span><div class="vbox" style="background:${N.bg}"><span style="width:66px;height:66px;border-radius:50%;overflow:hidden;display:block">${licon(L,c,66)}</span></div></div><div><span class="lbl">One colour</span><div class="vbox" style="background:#FFFFFF">${lsvg(L.mark,{D:'#111111',P:'#111111',A:'#111111',L:'#FFFFFF',G:'#FFFFFF'},66)}</div></div></div><div class="card${locked('logo',L.id)}">${pk('logo',L.id)}</div></div></div>`}}));

add({sec:'logo',title:'All eleven side by side',th:'เทียบโลโก้ทั้งหมด',side:palPick,body:cur=>{const c=cur.c,N=cur.N;const ink={D:'#111111',P:'#111111',A:'#111111',L:'#FFFFFF',G:'#FFFFFF'};
  const row=(label,f,bg)=>`<div class="sbs-row"><span class="lbl">${label}</span>${LOGOS.map(L=>`<div class="sbs-cell" style="${bg?'background:'+bg:''}">${f(L)}</div>`).join('')}</div>`;
  return `<div class="sbs"><div class="sbs-row"><span></span>${LOGOS.map((L,i)=>`<button type="button" class="sbs-head" data-go="${firstLogo+i}"><span class="mono" style="color:var(--brass)">${i+1}</span> ${esc(L.name)}</button>`).join('')}</div>${row('App icon 64',L=>licon(L,c,64))}${row('App icon 40',L=>licon(L,c,40))}${row('App icon 24',L=>licon(L,c,24))}${row('One colour',L=>lsvg(L.mark,ink,48),'#FFFFFF')}${row('On deep green',L=>lsvg(L.mark,lmap(c,'rev',c.d),48),c.d)}</div>`}});
add({sec:'logo',title:'Stacked versions',th:'แบบวางซ้อน',side:palPick,body:cur=>{const c=cur.c,N=cur.N;const S=LOGOS.map((L,i)=>[L,i]).filter(([L])=>L.stack);
  return `<div class="grid c4">${S.map(([L,i])=>card('logo',L.id,`<div class="stk"><div style="background:${N.bg}">${lsvg(L.stack,lmap(c,'pos',N.bg),124)}</div><div style="background:${c.d}">${lsvg(L.stack,lmap(c,'rev',c.d),66)}</div></div>`,`<span class="mono" style="color:var(--brass)">${i+1}</span> ${esc(L.name)}`,'','',true)).join('')}</div>`}});

function inUse(L,c,N){
  const lockH=lh(L,22,34,46);
  const splash=`<div class="mk mk-phone"><div class="scr2" style="background:${c.d}">${lsvg(L.mark,lmap(c,'rev',c.d),46)}<div style="margin-top:8px">${lsvg(L.lock,lmap(c,'rev',c.d),Math.round(lockH*0.42))}</div></div></div>`;
  const bag=`<div class="mk mk-bag"><svg viewBox="0 0 120 130" width="104" height="112" aria-hidden="true"><path d="M14 30h92l8 96H6z" fill="#C9A27A"/><path d="M14 30h92l-2 10H16z" fill="#B38D66"/><path d="M42 30c0-14 36-14 36 0" fill="none" stroke="#8B6B4A" stroke-width="4"/></svg><div class="bagmark">${lsvg(L.mark,lmap(c,'ink'),52)}</div></div>`;
  const sticker=`<div class="mk mk-sticker"><span style="width:96px;height:96px;border-radius:50%;overflow:hidden;display:block;box-shadow:0 0 0 5px #FFFFFF,0 6px 14px rgba(0,0,0,.18)">${licon(L,c,96)}</span></div>`;
  const post=`<div class="mk mk-post" style="background:${c.l}"><div style="position:absolute;left:10px;top:9px">${lsvg(L.lock,lmap(c,'pos',c.l),Math.round(lockH*0.72))}</div><div style="position:absolute;left:10px;right:10px;bottom:10px"><div style="font-family:var(--dis);font-weight:700;font-size:15px;line-height:1.15;color:${c.d}">Good food, every week</div><div class="th" style="font-size:12px;color:${c.p}">อาหารดี ส่งถึงทุกสัปดาห์</div></div><span style="position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:${c.a}"></span></div>`;
  return [splash,bag,sticker,post];
}

function palCard(Pp,N){const w=contrast('#FFFFFF',Pp.p);const near=nearG(Pp.p);const nearTxt=near<8?'<span class="no">very close</span>':near<15?'close':'<span class="ok">clearly different</span>';
  return card('palette',Pp.id,`<div class="pal-sw pal5">${[['Main',Pp.p],['Deep',Pp.d],['Accent',Pp.a],['Accent 2',Pp.a2],['Light',Pp.l]].map(([n,h])=>`<div style="background:${h};color:${textOn(h)}"><span>${n}</span><span>${h}</span></div>`).join('')}</div>${palMock(Pp,N)}`,esc(Pp.name)+thsmall(Pp.th),esc(Pp.story),`<div class="facts"><span>White text on the main colour: <b>${fmt1(w)}</b> ${w>=4.5?'<span class="ok">fine for text</span>':w>=3?'big text only':'<span class="no">too light for text</span>'}</span><span>Next to Grab and LINE MAN green: ${nearTxt}</span></div>`)}

function hueMap(){
  const toLCH=hex=>{const q=toLab(hex);let h=Math.atan2(q[2],q[1])*180/Math.PI;if(h<0)h+=360;return {L:q[0],h}};
  const W=760,H=430,pl=46,pr=20,pt=18,pb=40;
  const H0=108,H1=200,L0=.40,L1=.84;const X=h=>pl+(h-H0)/(H1-H0)*(W-pl-pr),Y=L=>H-pb-(L-L0)/(L1-L0)*(H-pt-pb);
  const place=hex=>{const q=toLCH(hex);return {x:X(Math.min(H1-2,Math.max(H0+2,q.h))),y:Y(Math.min(L1-.01,Math.max(L0+.01,q.L)))}};
  const rv=[{n:'GrabFood',hex:'#00B14F'},{n:'LINE MAN',hex:'#0DC863'},{n:'Uber Eats',hex:'#06C167'}].map(r=>Object.assign(r,place(r.hex)));
  rv.sort((a,b)=>a.y-b.y);rv.forEach((r,i)=>{r.ly=r.y+4;if(i&&r.ly-rv[i-1].ly<15)r.ly=rv[i-1].ly+15});
  const pp=PALETTES.map((p,i)=>Object.assign({n:String(i+1),hex:p.p},place(p.p)));
  pp.forEach(p=>{p.dx=p.x;p.dy=p.y});
  for(let it=0;it<60;it++){let moved=false;pp.forEach((a,i)=>pp.forEach((b,j)=>{if(j<=i)return;const dx=b.dx-a.dx,dy=b.dy-a.dy,d=Math.hypot(dx,dy);if(d<23){const m=(23-d)/2+.5,ux=d?dx/d:1,uy=d?dy/d:0;a.dx-=ux*m;a.dy-=uy*m;b.dx+=ux*m;b.dy+=uy*m;moved=true}}));if(!moved)break}
  const grid=[120,135,150,165,180,195].map(h=>`<line x1="${X(h)}" y1="${pt}" x2="${X(h)}" y2="${H-pb}" stroke="#E3E8E3"/><text x="${X(h)}" y="${H-pb+16}" text-anchor="middle" font-size="10.5" fill="#7C8A87" font-family="'PB IBM Plex Mono',IBM Plex Mono,monospace">${h}°</text>`).join('');
  const names=[[118,'yellow green'],[150,'green'],[188,'teal']].map(([h,t])=>`<text x="${X(h)}" y="${H-6}" text-anchor="middle" font-size="11" fill="#5B6B68">${t}</text>`).join('');
  const ylab=`<text x="12" y="${pt+8}" font-size="10.5" fill="#7C8A87" font-family="'PB IBM Plex Mono',IBM Plex Mono,monospace">light</text><text x="12" y="${H-pb}" font-size="10.5" fill="#7C8A87" font-family="'PB IBM Plex Mono',IBM Plex Mono,monospace">dark</text>`;
  const rdots=rv.map(r=>`<circle cx="${r.x.toFixed(1)}" cy="${r.y.toFixed(1)}" r="9" fill="${r.hex}" stroke="#16302F" stroke-width="2" stroke-dasharray="3 2"/><text x="${(r.x-15).toFixed(1)}" y="${r.ly.toFixed(1)}" text-anchor="end" font-size="12" font-weight="500" fill="#5B6B68">${esc(r.n)}</text>`).join('');
  const leads=pp.filter(p=>Math.hypot(p.dx-p.x,p.dy-p.y)>3).map(p=>`<path d="M${p.x.toFixed(1)} ${p.y.toFixed(1)}L${p.dx.toFixed(1)} ${p.dy.toFixed(1)}" stroke="#9AA8A4" stroke-width="1"/><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${p.hex}"/>`).join('');
  const pdots=pp.map(p=>`<circle cx="${p.dx.toFixed(1)}" cy="${p.dy.toFixed(1)}" r="11" fill="${p.hex}" stroke="#FFFFFF" stroke-width="2.5"/><text x="${p.dx.toFixed(1)}" y="${(p.dy+3.8).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${textOn(p.hex)}">${p.n}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Main colours of our twelve palettes and three delivery apps by hue and lightness">${grid}${names}${ylab}${leads}${rdots}${pdots}</svg>`;
}
add({sec:'colour',title:'Our greens next to theirs',th:'สีเขียวของเราเทียบกับแอปอื่น',body:()=>{const rows=PALETTES.map((p,i)=>({p,i,near:nearG(p.p)})).sort((a,b)=>b.near-a.near);const mx=Math.max(...rows.map(r=>r.near));
  return `<div class="grid" style="grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px"><div class="map">${hueMap()}</div><div class="bcard" style="gap:7px"><div class="lbl">How far each main colour is from Grab and LINE MAN green</div>${rows.map(r=>`<div style="display:grid;grid-template-columns:22px 150px minmax(0,1fr) 36px;gap:8px;align-items:center;font-size:12.5px"><span style="width:20px;height:20px;border-radius:50%;background:${r.p.p};color:${textOn(r.p.p)};display:grid;place-items:center;font-size:10px;font-weight:700">${r.i+1}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.p.name)}</span><span style="height:10px;border-radius:5px;background:${r.near<8?'#B33A1A':r.near<15?'#C08A2E':'#2F6E45'};width:${Math.max(4,r.near/mx*100).toFixed(0)}%"></span><span class="mono" style="text-align:right">${fmt1(r.near)}</span></div>`).join('')}<p class="src" style="margin:4px 0 0">Colour distance in OKLab, times 100. Under 8 is very close, 8 to 15 is close, and over 15 is clearly different. Grab green is about #00B14F, taken from a screenshot. blueplus+ is blue, far off this chart, so it is left out.</p></div></div>`}});

function optName(set,id){
  const find=(list,key)=>{const x=list.find(o=>(Array.isArray(o)?o[0]:o.id)===id);return x?(Array.isArray(x)?x[key||1]:(x.name||x.en)):id};
  switch(set){
    case 'words':return find(WORDS);
    case 'logo':return id==='l0'?'Our logo today':find(LOGOS);
    case 'mascot':return find(MASCOT);case 'lockup':return find(LOCKUP);
    case 'palette':return find(PALETTES);case 'neutral':return find(NEUTRALS);case 'states':return find(STATES);
    case 'font':return find(FONTS);case 'iconstyle':return find(ISTYLES);case 'corner':return find(CORNERS);
    case 'shapes':return find(SHAPES);case 'patterns':return find(PATTERNS);case 'shadow':return find(SHADOWS);
    case 'swatch':{const w=SWALL.find(x=>x[0]===id);return w?w[1]+' '+w[0]:id}
    case 'photos':return find(PHOTOS);case 'captions':return find(CAPTIONS);case 'tone':return find(TONES);case 'promise':return find(PROMISES);
    case 'tagline':{const t=TAGLINES.find(o=>o.id===id);return t?t.en+' / '+t.th:id}
    default:return id;
  }
}
function aboutVal(f){const q=ABOUT.find(x=>x[0]===f);const v=(S.about||{})[f];if(!q||!v)return '';const o=q[3].find(x=>x[0]===v);return o?o[1]:v}
function flatAnswers(p){
  const ab=S.about||{},own=S.own||{};
  const rows=[['Sent at',p.sentAt],['Respondent',p.rid],['Gender',aboutVal('gender')],['Age',aboutVal('age')],['Area',aboutVal('area')],['District',ab.district||''],['Food delivery',aboutVal('delivery')],['Meal plans',aboutVal('plan')],['Work',aboutVal('job')],['Work in own words',ab.jobtext||'']];
  Object.keys(SETS).forEach(k=>rows.push([SETS[k].label,(p.picks[k]||[]).join('; ')]));
  rows.push(['Own promise',own.promise||''],['Own tagline',own.tagline||''],['Own hashtags',own.hashtags||'']);
  rows.push(['Comments',Object.keys(p.comments).map(k=>k.split('|').slice(1).join(' ')+': '+p.comments[k]).join(' | ')]);
  return rows}

 'Our promise|':['What PintoBox should say first. Pick up to two, or write your own.','PintoBox ควรบอกอะไรเป็นอย่างแรก เลือกได้สูงสุด 2 ข้อ หรือเขียนเอง'],
 'Taglines|':['Pick up to three taglines, or write your own.','เลือกสโลแกนได้สูงสุด 3 อัน หรือเขียนเอง'],
 'Post style and hashtags|':['Pick one post style and the hashtags you like.','เลือกสไตล์โพสต์ 1 แบบ และแฮชแท็กที่ชอบ'],
 'How to answer|':['Three steps. · สามขั้นตอน',''],
 'Check and send|':['Check your answers, then press Send.','ตรวจคำตอบ แล้วกดส่ง']
};
function slideHTML(i,cur){
  const s=DECK[i];
  if(s.cover)return s.body(cur);
  const kick=`${secNo(s.sec)} · ${SN[s.sec]}${s.kick?' · '+s.kick:''}`;
  const tt=stripTags(s.title);const LD=LEADS[tt+'|'+(s.kick||'')]||LEADS[tt+'|*'];
  const en=LD?LD[0]:(s.lead||''),th=LD?LD[1]:'';
  const ck=s.sec+'|'+tt+(s.kick?' '+s.kick:'');const cmv=(S.cm&&S.cm[ck])||'';
  const foot=s.nocm?`<footer class="sf"><span>PintoBox</span><span class="pg"><b>${i+1}</b> / ${DECK.length}</span></footer>`:`<footer class="sf cmf"><label class="cml" for="cm${i}">Comment · ความคิดเห็น</label><input class="cmi" id="cm${i}" type="text" maxlength="400" autocomplete="off" data-cm="${esc(ck)}" value="${esc(cmv)}" placeholder="What do you like or not like on this page? · ชอบหรือไม่ชอบอะไรในหน้านี้"><span class="pg"><b>${i+1}</b> / ${DECK.length}</span></footer>`;
  return `<section class="slide" aria-label="${esc(tt)}"><header class="sh"><div class="kick">${kick}</div><h2>${s.title}${s.th?`<small>${s.th}</small>`:''}</h2>${s.side?`<div class="side">${s.side(cur)}</div>`:''}${en?`<p class="lead">${en}${th?` <span class="lth">${th}</span>`:''}</p>`:''}</header><div class="sb">${s.body(cur)}</div>${foot}</section>`;
}
function setStatus(kind,msg){const el=document.getElementById('status');el.className='status'+(kind==='live'?' live':kind==='bad'?' bad':'');el.querySelector('span').textContent=msg;el.title=msg}
function buildJump(){const j=document.getElementById('jump');let h='';SECTIONS.forEach(s=>{const items=DECK.map((x,i)=>[x,i]).filter(([x])=>x.sec===s.id);if(!items.length)return;h+=`<optgroup label="${secNo(s.id)} ${esc(SN[s.id])}">${items.map(([x,i])=>`<option value="${i}">${i+1}. ${esc(stripTags(x.title))}${x.kick?' · '+esc(x.kick):''}</option>`).join('')}</optgroup>`});j.innerHTML=h}
function render(){
  const cur=current();
  CUR=Math.max(0,Math.min(DECK.length-1,CUR));
  document.getElementById('stage').innerHTML=slideHTML(CUR,cur);
  document.getElementById('count').textContent=(CUR+1)+' / '+DECK.length;
  document.getElementById('prog').style.width=((CUR+1)/DECK.length*100).toFixed(2)+'%';
  const j=document.getElementById('jump');if(j.value!==String(CUR))j.value=String(CUR);
  document.getElementById('prev').disabled=CUR===0;document.getElementById('next').disabled=CUR===DECK.length-1;
}
function go(i){CUR=Math.max(0,Math.min(DECK.length-1,i));try{localStorage.setItem('pbq-slide',String(CUR))}catch(e){}try{history.replaceState(null,'','#'+(CUR+1))}catch(e){}render();document.getElementById('vp').scrollTop=0;if(document.body.classList.contains('flowmode'))window.scrollTo(0,0)}
const ZOOM=(()=>{try{return !!(window.CSS&&CSS.supports&&CSS.supports('zoom','2'))}catch(e){return false}})();
function fit(){
  const deck=document.getElementById('deck'),st=document.getElementById('stage'),ho=document.getElementById('holder'),ctrl=document.getElementById('ctrl');
  const vw=window.innerWidth,vh=window.innerHeight;
  const flow=vw<760||(vh>vw*1.15&&vw<1000);
  deck.classList.toggle('flow',flow);document.body.classList.toggle('flowmode',flow);
  if(flow){st.style.zoom='';st.style.transform='';ho.style.width='';ho.style.height='';return}
  const z=Math.max(.3,Math.min((vw-24)/1280,(vh-ctrl.offsetHeight-24)/720));
  if(ZOOM){st.style.zoom=String(z);st.style.transform='';ho.style.width='';ho.style.height=''}
  else{st.style.zoom='';st.style.transform='scale('+z+')';st.style.transformOrigin='0 0';ho.style.width=(1280*z)+'px';ho.style.height=(720*z)+'px'}
}

/* ---------- saving and sending ---------- */
let MODE='local';
const ENDPOINT='https://script.google.com/macros/s/AKfycbwGLLOL9LRS_Qd7hIsYvW1D6ylxswbvYNA58geFpgMqy6yOqT6Vw17wDnb8-zBRB0hsig/exec';
const LSK='pbq-state';
function saveLocal(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LSK)||'null');if(v&&typeof v==='object')Object.keys(S).forEach(k=>{if(v[k]!==undefined&&v[k]!==null)S[k]=v[k]})}catch(e){}}
function save(){saveLocal()}
function toggle(doc,set,opt){const max=SETS[set].max;const a=arr(doc,set).slice();const i=a.indexOf(opt);if(i>=0)a.splice(i,1);else{a.push(opt);while(a.length>max)a.shift()}S[doc]=Object.assign({},S[doc]||{},{[set]:a});save();render()}
function newRid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function payload(){
  if(!S.rid){S.rid=newRid();saveLocal()}
  const picks={},ids={};Object.keys(SETS).forEach(k=>{const a=arr(ME,k);ids[k]=a.slice();picks[k]=a.map(o=>stripTags(optName(k,o)))});
  const comments={};Object.keys(S.cm||{}).forEach(k=>{const v=String(S.cm[k]||'').trim();if(v)comments[k]=v});
  const p={rid:S.rid,sentAt:new Date().toISOString(),about:Object.assign({},S.about||{}),picks,ids,own:Object.assign({},S.own||{}),comments,version:'q1'};
  p.flat=flatAnswers(p);return p}
function sentOK(){S.sent=new Date().toISOString();saveLocal();render()}
function showCopy(msg){const w=document.getElementById('copywrap'),box=document.getElementById('copyout'),m=document.getElementById('sendmsg');if(m&&msg)m.textContent=msg;if(w&&box){box.value=answersText();w.hidden=false}}
async function send(){
  const p=payload();const m=document.getElementById('sendmsg');if(m)m.textContent='Sending · กำลังส่ง';
  if(MODE==='google'){try{google.script.run.withSuccessHandler(sentOK).withFailureHandler(()=>showCopy('It did not send. Please copy your answers below. · ส่งไม่สำเร็จ กรุณาคัดลอกคำตอบด้านล่าง')).submit(JSON.stringify(p))}catch(e){showCopy('It did not send. Please copy your answers below. · ส่งไม่สำเร็จ กรุณาคัดลอกคำตอบด้านล่าง')}return}
  if(MODE==='post'){try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});sentOK()}catch(e){showCopy('It did not send. Please copy your answers below. · ส่งไม่สำเร็จ กรุณาคัดลอกคำตอบด้านล่าง')}return}
  showCopy('This copy of the page cannot send. Please copy your answers below. · หน้านี้ส่งเองไม่ได้ กรุณาคัดลอกคำตอบด้านล่าง');
}
async function connect(){
  loadLocal();if(!S.rid){S.rid=newRid();saveLocal()}
  if(window.google&&google.script&&google.script.run){MODE='google';render();return}
  if(ENDPOINT){MODE='post';render();return}
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='prev'){go(CUR-1);return}
  if(b.id==='next'){go(CUR+1);return}
  if(b.dataset.go!==undefined&&b.dataset.go!==''){go(+b.dataset.go);return}
  if(b.dataset.act==='pick'){const host=b.closest('[data-set]');if(!host)return;toggle(ME,host.dataset.set,host.dataset.opt);return}
  if(b.dataset.about){const f=b.dataset.about,v=b.dataset.val;S.about=Object.assign({},S.about||{});S.about[f]=S.about[f]===v?'':v;save();render();return}
  if(b.dataset.view){VIEW.listStyle=b.dataset.view;render();return}
  if(b.dataset.pal){VIEW.pal=VIEW.pal===b.dataset.pal?null:b.dataset.pal;render();return}
  if(b.id==='sendBtn'){send();return}
  if(b.id==='copy'){const txt=answersText();const box=document.getElementById('copyout');box.value=txt;
    const done=()=>{b.textContent='Copied · คัดลอกแล้ว'},fail=()=>{box.focus();box.select();b.textContent='Select the text and copy it · เลือกข้อความแล้วคัดลอก'};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fail);else fail()}catch(err){fail()}}
});
document.getElementById('jump').addEventListener('change',e=>go(+e.target.value));
document.addEventListener('keydown',e=>{
  const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.tagName==='SELECT'||t.isContentEditable))return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!(t&&t.tagName==='BUTTON'))){e.preventDefault();go(CUR+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(CUR-1)}
  else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(DECK.length-1)}
});
const tmr={};
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.cm!==undefined){S.cm=Object.assign({},S.cm||{});S.cm[t.dataset.cm]=t.value;clearTimeout(tmr.c);tmr.c=setTimeout(save,400);return}
  if(t.dataset.own){S.own=Object.assign({},S.own||{});S.own[t.dataset.own]=t.value;clearTimeout(tmr.o);tmr.o=setTimeout(save,400);return}
  if(t.dataset.abouttext){S.about=Object.assign({},S.about||{});S.about[t.dataset.abouttext]=t.value;clearTimeout(tmr.a);tmr.a=setTimeout(save,400);return}
});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.custom!==undefined){setCustom(t.value);VIEW.pal='custom';render()}});
window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{const h=parseInt(String(location.hash||'').replace('#',''),10);if(h>0&&h-1!==CUR)go(h-1)});

buildJump();fit();render();connect();
})();
</script>
