<style>
/* The page around the slides follows light or dark mode. The slides are always paper, like a projected deck,
   so every brand colour is judged on the same white. */
:root{
  --page:#E4E7E2; --bar:#FFFFFF; --barink:#16302F; --barmute:#5B6B68; --barline:#D5DBD5; --barchip:#F1F3EF;
  --ui:'PB IBM Plex Sans','IBM Plex Sans','PB IBM Plex Sans Thai','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'PB IBM Plex Mono','IBM Plex Mono','PB IBM Plex Sans Thai','IBM Plex Sans Thai',ui-monospace,SFMono-Regular,Menlo,monospace;
  --dis:'PB Archivo','Archivo','PB IBM Plex Sans','IBM Plex Sans','PB IBM Plex Sans Thai','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0F1615; --bar:#18211F; --barink:#E7EEEC; --barmute:#9FB0AC; --barline:#2C3936; --barchip:#212C2A; color-scheme:dark}}
:root[data-theme="dark"]{--page:#0F1615; --bar:#18211F; --barink:#E7EEEC; --barmute:#9FB0AC; --barline:#2C3936; --barchip:#212C2A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--barink);font-family:var(--ui);font-size:15px;line-height:1.5;overflow:hidden}
body.flowmode{overflow:auto}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body.flowmode::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60;pointer-events:none}
button{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #1F5E5B;outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* deck frame */
.deck{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.vp{min-height:0;overflow:auto;display:grid;place-items:center;padding:12px}
.holder{position:relative}
.stage{width:1280px;height:720px;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 40px rgba(10,30,28,.14);
  --ink:#16302F; --teal:#1F5E5B; --brass:#C08A2E; --chili:#B33A1A; --paper:#F4F5F2; --panel:#FFFFFF; --line:#DCE1DC; --mute:#5B6B68;
  --chip:#EEF1EC; --soft:#E6EAE5; --sel:#16302F; --selink:#FFFFFF; --gold:#C08A2E; --okay:#2F6E45; --warn:#B33A1A; --r:12px;
  background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;color-scheme:light}
.deck.flow{position:static;display:block}
.flow .vp{display:block;padding:0;overflow:visible}
.flow .stage{width:auto;height:auto;border-radius:0;box-shadow:none;overflow:visible}

/* slide template */
.slide{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:30px 44px 14px}
.flow .slide{position:static;padding:22px 16px 16px;min-height:calc(100vh - 120px)}
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:end}
.sh .kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);grid-column:1/-1}
.sh h2{font-family:var(--dis);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sh h2 small{font-family:'PB IBM Plex Sans Thai','IBM Plex Sans Thai',sans-serif;font-weight:400;font-size:.5em;color:var(--mute);margin-left:12px;letter-spacing:0}
.sh .lead{grid-column:1/-1;margin:2px 0 0;color:var(--mute);font-size:15px;max-width:110ch}
.sh .side{align-self:end}
.flow .sh{grid-template-columns:1fr}
.flow .sh h2{font-size:26px}
.sb{min-height:0;position:relative}
.sf{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#8A9693;border-top:1px solid var(--line);padding-top:7px}
.sf b{font-weight:500;color:var(--teal)}
.src{font-family:var(--mono);font-size:10.5px;color:#7C8A87;line-height:1.4;margin-top:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.th{font-family:'PB IBM Plex Sans Thai','IBM Plex Sans Thai','PB IBM Plex Sans','IBM Plex Sans',sans-serif}
.mute{color:var(--mute)}
h3,h4{margin:0}

/* grids, fixed columns on the slide and single columns on a phone */
.grid{display:grid;gap:12px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c5{grid-template-columns:repeat(5,minmax(0,1fr))}.c6{grid-template-columns:repeat(6,minmax(0,1fr))}.c7{grid-template-columns:repeat(7,minmax(0,1fr))}
.flow .c3,.flow .c2{grid-template-columns:1fr}
.flow .c4,.flow .c5,.flow .c6,.flow .c7{grid-template-columns:repeat(2,minmax(0,1fr))}

/* cards and pick bars */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.locked{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 50%,transparent)}
.card .body{padding:10px 12px 10px;display:grid;gap:4px;flex:1;align-content:start}
.card .name{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:400}
.card .desc{font-size:12.5px;color:var(--mute);margin:0}
.stagesvg{display:block;width:100%;height:auto}
.pk{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--line);background:var(--chip)}
.pk .me-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;font-weight:500;min-height:30px}
.pk .me-btn[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.pk .who{display:flex;gap:3px;flex:1;flex-wrap:wrap;min-width:0}
.pk .who .dot{min-width:22px;height:19px;padding:0 5px;border-radius:999px;font-size:9.5px;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.pk .star{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 9px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;color:var(--mute);min-height:30px}
.pk .star svg{width:13px;height:13px}
.pk .star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipopt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 6px 5px 14px;font-size:14px}
.chipopt.locked{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.chipopt .pk{border:0;background:none;padding:0;gap:4px}
.chipopt small{color:var(--mute);font-size:12px}
.note{font-size:12.5px;color:var(--mute);background:var(--chip);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:10px 0 0}
.vbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;margin:0 2px 0 0}
.vbtn[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}

/* cover and how-to */
.cover{position:absolute;inset:0;padding:54px 64px 40px;display:grid;grid-template-rows:auto 1fr auto;background:#16302F;color:#F4F5F2;overflow:hidden}
.flow .cover{position:static;min-height:calc(100vh - 120px);padding:28px 18px}
.cover .kick{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C08A2E}
.cover h1{font-family:var(--dis);font-weight:800;font-size:66px;line-height:1.02;letter-spacing:-.025em;margin:22px 0 0;max-width:15ch}
.flow .cover h1{font-size:38px}
.cover p{font-size:18px;color:#B9C9C5;margin:18px 0 0;max-width:60ch}
.cover .icons{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.cover .icons svg{border-radius:14px}
.cover .foot{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#8FA8A2;border-top:1px solid #2C4A47;padding-top:12px;margin-top:22px;flex-wrap:wrap}
.cover .th{color:#C08A2E}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.flow .steps{grid-template-columns:1fr}
.stp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:grid;gap:8px;align-content:start}
.stp .n{font-family:var(--dis);font-weight:800;font-size:30px;color:var(--brass);line-height:1}
.stp b{font-size:19px}
.stp p{margin:0;color:var(--mute);font-size:15px}
.bigme{display:flex;gap:8px;flex-wrap:wrap}
.bigme button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;min-height:40px}
.bigme button[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.order{display:flex;gap:3px;min-height:96px}
.order .seg{flex-basis:0;min-width:64px;border-radius:8px;background:var(--soft);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;text-decoration:none;color:var(--ink);border:0;cursor:pointer;text-align:left}
.order .seg b{font-size:14px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.order .seg span{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.order .seg.done{background:color-mix(in srgb,var(--gold) 26%,var(--soft))}
.flow .order{flex-wrap:wrap}.flow .order .seg{flex:1 1 calc(33% - 3px)!important;min-height:48px}

/* other brands */
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.bcard .bh{display:flex;gap:10px;align-items:center}
.bcard .bh .sw{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bcard .bh .sw.none{background:var(--chip);display:grid;place-items:center;font:500 11px var(--mono);color:var(--mute)}

const STEEL='#8E9996',STEEL_LT='#CBD3D0';
const GRN={pos:{D:TODAYG,P:TODAYG,A:'#DCEAAE',L:'#FFFFFF',G:'#FFFFFF',S:TODAYG,T:'#FFFFFF'},rev:{D:'#FFFFFF',P:'#FFFFFF',A:'#DCEAAE',L:TODAYG,G:TODAYG,S:'#FFFFFF',T:'#FFFFFF'}};
/* every logo is drawn in the person's palette: dark, main, accent and light from the palette, and steel for the carrier */
function lmap(c,mode,ground){
  if(mode==='rev')return {D:'#FFFFFF',P:r300(c.p),A:c.a,L:c.d,G:ground||c.d,S:STEEL_LT,T:STEEL_LT};
  if(mode==='ink')return {D:'#2E2419',P:'#2E2419',A:'#2E2419',L:'#FFFFFF',G:'#FFFFFF',S:'#2E2419',T:'#FFFFFF'};
  if(mode==='one')return {D:c.d,P:c.d,A:c.d,L:'#FFFFFF',G:ground||'#FFFFFF',S:c.d,T:'#FFFFFF'};
  return {D:c.d,P:c.p,A:c.a,L:c.l,G:ground||c.paper,S:STEEL,T:STEEL_LT};
}
const lpaint=(svg,m)=>svg.replace(/\{([DPALGST])\}/g,(_,k)=>m[k]);

function licon(L,c,size,m){return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${esc(L.name)} app icon" style="display:block;flex:none">${lpaint(L.icon,m||lmap(c,'pos'))}</svg>`}

function friendPose(c,kind){const base=friendArt(c);

  const noR=base.replace(/<g class="arm-r">.*?<\/g>/,'');
  if(kind==='wave')return noR+arm('M65 25.5H72A14.5 14.5 0 0 1 86.5 40V54L100 38')+hand(101.5,36)+`<path d="M104 24l3 -5M109 30l5 -2" stroke="${STEEL}" stroke-width="2.6" stroke-linecap="round"/>`;

  if(kind==='sign')return noR+`<path d="M100 48V18" stroke="${c.d}" stroke-width="3.5" stroke-linecap="round"/><rect x="84" y="2" width="31" height="20" rx="5" fill="${c.a}"/><text x="99.5" y="16.5" text-anchor="middle" font-family="'PB Kanit','Kanit',sans-serif" font-weight="700" font-size="11.5" fill="${textOn(c.a)}">ใหม่</text>`+arm('M65 25.5H72A14.5 14.5 0 0 1 86.5 40V58L100 46')+hand(100.5,45.5);
  return base}

/* ---------- logo layout: the symbol, the English name and the Thai name, put together as the person chooses ---------- */
function lparts(L){
  const P=LPARTS[L.id];let en;
  if(P.en.src==='cut')en={svg:L.lock.svg.slice(L.mark.svg.length),bb:P.en.bb};
  else if(P.en.src==='lock')en={svg:L.lock.svg,bb:P.en.bb};
  else if(P.en.src==='kanit')en={svg:`<path d="${LNAMES.en.kanit600.d}" fill="{D}"/>`,bb:LNAMES.en.kanit600.bb};
  else{const K=LOGOS.find(l=>l.id==='k8');en={svg:K.lock.svg.slice(K.mark.svg.length),bb:LPARTS.k8.en.bb}}
  const T=LNAMES.th[P.th];
  return {sym:{svg:L.mark.svg,bb:P.sb},en,th:{svg:`<path d="${T.d}" fill="{D}"/>`,bb:T.bb}};
}
function lockup(L,c,arr,emph,h,bg,mode){
  const p=lparts(L),m=lmap(c,mode||'pos',bg);
  const mk=(part,hh,small)=>({svg:small?part.svg.replace(/\{D\}/g,'{P}'):part.svg,bb:part.bb,s:hh/part.bb[3]});
  let lines=[];
  if(arr!=='mark'){
    if(emph==='en')lines=[mk(p.en,100)];
    else if(emph==='th')lines=[mk(p.th,100)];
    else if(emph==='english')lines=[mk(p.en,100),mk(p.th,44,true)];
    else if(emph==='same')lines=[mk(p.th,70),mk(p.en,70)];
    else lines=[mk(p.th,100),mk(p.en,42,true)];
  }
  const gapL=16,textH=lines.reduce((a,l)=>a+l.bb[3]*l.s,0)+(lines.length>1?gapL:0),textW=Math.max(0,...lines.map(l=>l.bb[2]*l.s));
  const sb=p.sym.bb,symH=arr==='mark'?200:arr==='stack'?150:Math.max(textH*1.08,124),ss=symH/sb[3],symW=sb[2]*ss;
  const place=(svg,bb,s,x,y)=>`<g transform="translate(${f2(x-bb[0]*s)} ${f2(y-bb[1]*s)}) scale(${f4(s)})">${svg}</g>`;
  const parts=[];let W,Ht;
  if(arr==='mark'){parts.push(place(p.sym.svg,sb,ss,0,0));W=symW;Ht=symH}
  else if(arr==='stack'){W=Math.max(symW,textW);parts.push(place(p.sym.svg,sb,ss,(W-symW)/2,0));let y=symH+30;
    lines.forEach(l=>{const lw=l.bb[2]*l.s;parts.push(place(l.svg,l.bb,l.s,(W-lw)/2,y));y+=l.bb[3]*l.s+gapL});Ht=y-gapL}
  else{const gap=36;Ht=Math.max(symH,textH);W=symW+gap+textW;const sx=arr==='left'?0:textW+gap,tx=arr==='left'?symW+gap:0;

add({sec:'hello',title:'What PintoBox is',th:'PintoBox คืออะไร',lead:['One place for healthy meal plans from many kitchens.','ที่เดียวที่รวมแผนอาหารสุขภาพจากหลายครัว'],body:cur=>{const c=cur.c;
  const st=[['search','Find','ค้นหา','Kitchens in Bangkok that cook healthy meal plans, all in one place.','ครัวอาหารสุขภาพในกรุงเทพฯ ที่ทำแผนอาหาร รวมไว้ในที่เดียว'],['calendar','Compare and subscribe','เปรียบเทียบและสมัคร','Compare the plans and prices. Then subscribe to the plan you like.','เปรียบเทียบแผนและราคา แล้วสมัครแผนที่คุณชอบ'],['scooter','Delivered on your days','ส่งถึงตามวันที่คุณเลือก','Your meals come to your home or office on the days in your plan.','อาหารส่งถึงบ้านหรือที่ทำงาน ตามวันในแผนของคุณ']];
  return `<div class="what"><div><p class="big">PintoBox is one place to find, compare and subscribe to healthy meal plans from many small kitchens.</p><p class="big th">PintoBox คือที่เดียวที่คุณค้นหา เปรียบเทียบ และสมัครแผนอาหารสุขภาพ จากครัวเล็ก ๆ หลายร้าน</p><div class="name"><b>Where the name comes from · ที่มาของชื่อ</b><p>A ปิ่นโต (pinto) is the Thai food carrier with stacked tiers. People in Thailand used to pay a home kitchen to fill their pinto with meals every day. This is called ผูกปิ่นโต. PintoBox brings this habit to your phone.</p><p class="th">ปิ่นโตคือภาชนะใส่อาหารแบบซ้อนชั้น คนไทยเคยจ้างครัวให้ทำอาหารใส่ปิ่นโตส่งให้ทุกวัน เรียกว่า ผูกปิ่นโต PintoBox นำธรรมเนียมนี้มาไว้ในมือถือของคุณ</p></div></div><div class="wr">${st.map(([icn,en,th,d,dth],i)=>`<div class="wst"><span class="wi">${badge(icn,c,48,en)}</span><div><b>${i+1}. ${en}<small class="th">${th}</small></b><p>${d}</p><p class="th">${dth}</p></div></div>`).join('')}<div class="why"><b>Why we ask you · ทำไมเราถามคุณ</b><p>We have not chosen our logo, colours or voice yet. Your picks help us choose.</p><p class="th">เรายังไม่ได้เลือกโลโก้ สี และน้ำเสียงของแบรนด์ คำตอบของคุณจะช่วยเราเลือก</p></div></div></div>`}});

add({sec:'hello',title:'Food apps in Thailand today',th:'แอปสั่งอาหารในไทยตอนนี้',lead:['The apps people use now to order food, each in its own brand colour.','แอปที่คนไทยใช้สั่งอาหารในตอนนี้ แต่ละแอปแสดงด้วยสีแบรนด์ของตัวเอง'],body:()=>{

  return `<div class="apps"><div class="appg">${tiles}</div><div style="display:grid;gap:12px;align-content:start"><div class="bcard" style="gap:12px;padding:16px 18px"><div class="lbl">Share of food delivery in Thailand, 2025 · ส่วนแบ่งตลาดส่งอาหารในไทย ปี 2568</div>${bar}${legend}<p style="margin:0;font-size:13.5px">Grab and LINE MAN together have close to 90%.</p><p class="th" style="margin:0;font-size:13px;color:var(--mute)">Grab และ LINE MAN รวมกันมีเกือบ 90%</p></div><div class="bcard" style="gap:6px;padding:16px 18px;border-color:var(--teal)"><b style="font-size:16px">PintoBox is different · PintoBox ต่างอย่างไร</b><p style="margin:0;font-size:14px">On these apps you place one order at a time. On PintoBox you choose a plan once, and your meals come every week.</p><p class="th" style="margin:0;font-size:13.5px;color:var(--mute)">แอปเหล่านี้สั่งได้ทีละออเดอร์ ส่วน PintoBox คุณเลือกแผนครั้งเดียว แล้วอาหารจะมาส่งทุกสัปดาห์</p></div><div class="src" style="margin:0">Shares: Momentum Works figures for 2025, as reported by the Bangkok Post and The Phuket News. Running in June 2026: Thairath Online, 15 June 2026. Bolt: Marketeer Online, and TTR Weekly, May 2026. foodpanda: Khaosod English, 23 April 2025. Brand colours are close matches from public colour listings, and Robinhood purple is from Brandfetch.<br><span class="th">ส่วนแบ่งตลาดเป็นตัวเลขปี 2568 ของ Momentum Works ตามที่ Bangkok Post และ The Phuket News รายงาน สถานะเดือนมิถุนายน 2569 จากไทยรัฐออนไลน์ 15 มิถุนายน 2569 ข้อมูล Bolt จาก Marketeer Online และ TTR Weekly พฤษภาคม 2569 ข้อมูล foodpanda จาก Khaosod English 23 เมษายน 2568 สีแบรนด์เป็นสีที่ใกล้เคียงจากรายการสีที่เผยแพร่ทั่วไป และสีม่วงของ Robinhood มาจาก Brandfetch</span></div></div></div>`}});

add({sec:'hello',nocm:true,title:'How to answer',th:'วิธีตอบ',lead:['Three steps. · สามขั้นตอน',''],body:()=>`<div class="howg"><div class="steps"><div class="stp"><span class="n">1</span><b>Tap Pick, or the heart</b><p class="th" style="color:var(--teal);font-size:16px">กดเลือก หรือกดหัวใจ</p><p>Tap Pick on what you like. The top of each page tells you how many. On the logo pages, tap the heart on every logo you like.</p><p class="th">กดเลือกสิ่งที่คุณชอบ ด้านบนของแต่ละหน้าบอกว่าเลือกได้กี่อย่าง ในหน้าโลโก้ ให้กดหัวใจที่โลโก้ทุกแบบที่คุณชอบ</p><div class="pk" style="border:1px solid var(--line);border-radius:10px;pointer-events:none;gap:10px" aria-hidden="true"><span class="me-btn" style="border:1px solid var(--sel);background:var(--sel);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px">✓ Picked · เลือกแล้ว</span><span class="hbtn" aria-pressed="true"><span class="hico">❤️</span><span>Liked · ชอบแล้ว</span></span></div></div><div class="stp"><span class="n">2</span><b>Write a comment</b><p class="th" style="color:var(--teal);font-size:16px">เขียนความคิดเห็น</p><p>Every page has a comment box at the bottom. Tell us what you like or do not like.</p><p class="th">ทุกหน้ามีช่องความคิดเห็นด้านล่าง บอกเราได้ว่าชอบหรือไม่ชอบอะไร</p></div><div class="stp"><span class="n">3</span><b>Press Send at the end</b><p class="th" style="color:var(--teal);font-size:16px">กดส่งในหน้าสุดท้าย</p><p>Your answers stay on this device until you press Send. You can stop and come back later.</p><p class="th">คำตอบของคุณจะเก็บไว้ในเครื่องนี้จนกว่าคุณจะกดส่ง หยุดพักแล้วกลับมาทำต่อได้</p></div></div><div><div class="lbl" style="margin-bottom:8px">The parts, in order. Tap one to go to it. · ส่วนต่าง ๆ ตามลำดับ แตะเพื่อไปที่ส่วนนั้น</div><div class="order">${SECTIONS.map((s,i)=>`<button type="button" class="seg${secDone(s.id)?' done':''}" data-go="${firstOf[s.id]}" style="flex-grow:${s.min}"><span class="mono">${String(i+1).padStart(2,'0')}</span><b>${esc(s.t)}</b><span class="th">${s.th}</span></button>`).join('')}</div></div></div>`});

add({sec:'words',title:'Three words for PintoBox',th:'สามคำที่บอกตัวตนของ PintoBox',lead:['Pick up to three words that should describe PintoBox.','เลือกคำที่ควรใช้บอกตัวตนของ PintoBox ได้สูงสุด 3 คำ'],body:()=>{const mine=arr(ME,'words');return `<div class="wordw"><div class="chips words">${WORDS.map(([id,en,th])=>`<span class="chipopt${locked('words',id)}${mine.includes(id)?' mine':''}"><span><b style="font-weight:500">${en}</b> <small class="th">${th}</small></span>${pk('words',id,true)}</span>`).join('')}</div><div class="swpicked"><span class="lbl">Your words · คำของคุณ · ${mine.length} of 3</span><span class="wpk">${mine.length?mine.map(id=>{const w=WORDS.find(x=>x[0]===id);return w?`<b>${esc(w[1])} <small class="th">${w[2]}</small></b>`:''}).join(''):'<span class="mute" style="font-size:12.5px">None yet · ยังไม่ได้เลือก</span>'}</span></div></div>`}});

/* colour section: every colour choice lives here, each page says what its colour is for */
/* the palettes come before the logos, so each palette is shown on our pinto drawing, the name and a button */
function palSample(P,c,h){return `<div class="palsamp" style="background:${P.l}"><span class="ps-art">${pintoArt('flat',c,h||150)}</span><span class="ps-txt"><b style="color:${P.d}">PintoBox</b><span class="ps-btn" style="background:${P.p};color:${textOn(P.p)}">Subscribe</span><span class="ps-tag" style="background:${P.a};color:${textOn(P.a)}">New · ใหม่</span></span></div>`}
function palCard(Pp,cur){const N=cur.N,c=colours(Pp,N),w=contrast('#FFFFFF',Pp.p),nr=nearestApp(Pp.p);
  const rt=RATE(w,'too light for text','อ่านยาก สีหลักอ่อนเกินไป'),nt=NEAR(nr);
  const sw=`<div class="pal-sw pal5">${[['Main','สีหลัก',Pp.p],['Deep','สีเข้ม',Pp.d],['Accent','สีเน้น',Pp.a],['Accent 2','สีเน้น 2',Pp.a2],['Light','สีอ่อน',Pp.l]].map(([n,t,h])=>`<div style="background:${h};color:${textOn(h)}"><span>${n}</span><span class="th">${t}</span><span>${h}</span></div>`).join('')}</div>`;
  return card('palette',Pp.id,sw+palSample(Pp,c),esc(Pp.name)+thsmall(Pp.th),dsc(Pp.story,Pp.sth),`<div class="facts"><span>White text on the main colour: <b>${fmt1(w)}</b> ${rt[0]}<span class="th fth">ตัวอักษรสีขาวบนสีหลัก ${fmt1(w)} ${rt[1]}</span></span><span>Next to the food apps: ${nt[0]}<span class="th fth">เทียบกับแอปส่งอาหาร ${nt[1]}</span></span></div>`)}
[0,1,2].forEach(k=>add({sec:'colour',sets:['palette'],kick:`${k+1} of 3`,title:'Twelve palettes',th:'ชุดสี 12 แบบ',lead:['The main palette is for the logo, buttons and the app icon. Pick one. The logo pages after this show the logos in it.','ชุดสีหลักใช้กับโลโก้ ปุ่ม และไอคอนแอป เลือก 1 ชุด หน้าโลโก้ถัดจากนี้จะแสดงโลโก้ด้วยชุดสีที่คุณเลือก'],body:cur=>`<div class="grid c4 palg">${PALETTES.slice(k*4,k*4+4).map(p=>palCard(p,cur)).join('')}</div>`}));

/* the own colour: an in-page colour wheel that works with a finger and with a mouse */
/* the wheel works on one colour of the set at a time: the main colour unless the person tapped another swatch */
const cwClamp=o=>({h:((o.h%360)+360)%360,L:Math.min(.97,Math.max(.12,o.L)),C:Math.min(.25,Math.max(0,o.C))});
function ownCW(){const t=VIEW.ownT||'p';
  if(t==='p'){const o=(S.own||{}).cw;if(o&&isFinite(o.h)&&isFinite(o.L)&&isFinite(o.C))return cwClamp(o)}
  else if(VIEW.ownCWt&&VIEW.ownCWt.t===t)return cwClamp(VIEW.ownCWt);
  const q=lchOf(t==='p'?ownHex():ownPalette(ownHex())[t]);return cwClamp({h:q.h,L:q.L,C:q.C})}
const cwHex=o=>lch2hex(o.L,o.C,o.h*Math.PI/180);
function ownSwatches(){const P=ownPalette(ownHex()),t=VIEW.ownT||'p',ov=ownOv(),changed=OWNK.some(([k])=>k!=='p'&&ov[k]);
  return `<div class="osw-g" role="group" aria-label="Your palette. Tap a colour to change it with the wheel">${OWNK.map(([k,n,th])=>`<button type="button" class="osw${k===t?' on':''}" data-ownt="${k}" aria-pressed="${k===t}" aria-label="Change ${n}" style="background:${P[k]};color:${textOn(P[k])}"><span class="osw-n">${n}</span><span class="th">${th}</span><span class="mono">${P[k]}</span>${k!=='p'&&ov[k]?'<i class="osw-e">changed · เปลี่ยนแล้ว</i>':''}</button>`).join('')}</div><button type="button" class="vbtn osw-r" id="ownReset"${changed?'':' disabled'}>Reset to suggested · กลับไปใช้ชุดที่แนะนำ</button>`}
function ownMini(cur){const P=ownPalette(ownHex()),N=cur.N;return `<div style="background:${N.bg};border:1px solid ${N.line};border-radius:12px;padding:10px;display:grid;gap:8px"><div style="background:${P.d};color:${textOn(P.d)};border-radius:9px;padding:8px 11px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center"><span>PintoBox</span><span style="background:${P.a};color:${textOn(P.a)};border-radius:999px;padding:1px 9px;font-size:11px">New · ใหม่</span></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;color:${N.ink};font-size:12.5px"><span>5 meals, Monday to Friday</span><span style="background:${P.p};color:${textOn(P.p)};border-radius:8px;padding:5px 12px;font-weight:600;font-size:12px">Subscribe</span></div></div>`}
function ownPreview(cur){/* the main colour fills the big panel, and the light colour panel shows the palette as the palette cards do */
  const P=ownPalette(ownHex()),c=colours(P,cur.N),w=contrast('#FFFFFF',P.p),nr=nearestApp(P.p),on=textOn(P.p);
  const lightArt={p:P.l,d:P.d,a:P.a,a2:P.a2,l:P.p};
  return `<div class="ownp-hero" style="background:${P.p}"><span class="ownp-lab" style="color:${on}">On your main colour · บนสีหลักของคุณ</span><span class="ownp-big"><span class="ownp-art">${pintoArt('flat',lightArt,150)}</span><b style="color:${on}">PintoBox</b></span></div><div class="ownp-row">${palSample(P,c,92)}</div><div class="facts" id="ownfacts" style="font-size:12.5px">${ownFacts(P)}</div>`}
function ownFacts(P){const w=contrast('#FFFFFF',P.p),t=contrast(P.d,P.l),nr=nearestApp(P.p),r1=RATE(w,'too light for text','อ่านยาก สีหลักอ่อนเกินไป'),r2=RATE(t,'too pale to read','อ่านยาก สีจางเกินไป'),nt=NEAR(nr);
  return `<span>White text on your main colour: <b>${fmt1(w)}</b> ${r1[0]}<span class="th fth">ตัวอักษรสีขาวบนสีหลักของคุณ ${fmt1(w)} ${r1[1]}</span></span><span>Deep text on your light colour: <b>${fmt1(t)}</b> ${r2[0]}<span class="th fth">ตัวอักษรสีเข้มบนสีอ่อนของคุณ ${fmt1(t)} ${r2[1]}</span></span><span>Next to the food apps: ${nt[0]}<span class="th fth">เทียบกับแอปส่งอาหาร ${nt[1]}</span></span>`}
function cwRing(){/* the hue ring: 72 slices of colour around a circle, 220 units across */
  let s='';const cx=110,r0=72,r1=104;
  for(let k=0;k<72;k++){const a0=k*5*Math.PI/180,a1=(k+1)*5*Math.PI/180,col=lch2hex(.74,.15,(k*5+2.5)*Math.PI/180);
    const P=(r,a)=>`${f2(cx+r*Math.sin(a))} ${f2(cx-r*Math.cos(a))}`;
    s+=`<path d="M${P(r0,a0)}L${P(r1,a0)}A${r1} ${r1} 0 0 1 ${P(r1,a1)}L${P(r0,a1)}A${r0} ${r0} 0 0 0 ${P(r0,a0)}Z" fill="${col}" stroke="${col}" stroke-width=".5"/>`}
  return `<svg viewBox="0 0 220 220" aria-hidden="true">${s}</svg>`}
const cwKnob=h=>{const a=h*Math.PI/180;return `left:${f2(50+40*Math.sin(a))}%;top:${f2(50-40*Math.cos(a))}%`};
const cwTrack=(o,k)=>{const st=k==='L'?[.3,.45,.6,.75,.88].map(L=>lch2hex(L,o.C,o.h*Math.PI/180)):[.02,.07,.12,.17,.22].map(C=>lch2hex(o.L,C,o.h*Math.PI/180));return `linear-gradient(90deg,${st.join(',')})`};
add({sec:'colour',sets:['palette'],title:'Or make your own palette',th:'หรือสร้างชุดสีของคุณเอง',lead:['Turn the wheel to choose a main colour, and we suggest a palette. Tap any colour of the set to change it too.','หมุนวงล้อเพื่อเลือกสีหลัก แล้วเราจะแนะนำชุดสีให้ แตะสีไหนในชุดก็เปลี่ยนได้'],body:cur=>{const o=ownCW(),hex=cwHex(o),tl=(OWNK.find(x=>x[0]===(VIEW.ownT||'p'))||OWNK[0]);
  return `<div class="own2"><div class="ownprev" id="ownprev">${ownPreview(cur)}</div><div class="ownctl"><div class="cwtarget" id="cwtarget">Changing · กำลังเปลี่ยน <b>${tl[1]} · ${tl[2]}</b></div><div class="cw"><div class="cwr" id="cwr" tabindex="0" role="slider" aria-label="Colour wheel. Use the arrow keys or drag around the ring" aria-valuemin="0" aria-valuemax="359" aria-valuenow="${Math.round(o.h)}">${cwRing()}<span class="cwc" id="cwc" style="background:${hex}"><span id="ownhex">${hex}</span></span><span class="cwk" id="cwk" style="${cwKnob(o.h)};background:${hex}"></span></div><div class="cwsl"><label for="cwl">Lighter or darker · อ่อนลงหรือเข้มขึ้น</label><input type="range" id="cwl" data-cw="L" min="12" max="97" step="1" value="${Math.round(o.L*100)}" style="background:${cwTrack(o,'L')}"><label for="cwc2">Softer or brighter · นุ่มลงหรือสดขึ้น</label><input type="range" id="cwc2" data-cw="C" min="0" max="25" step="1" value="${Math.round(o.C*100)}" style="background:${cwTrack(o,'C')}"></div></div><p class="cwhelp">Drag around the ring with your finger or the mouse, and use the two sliders. Tap a colour below to change that one.</p><p class="cwhelp th">ลากรอบวงล้อด้วยนิ้วหรือเมาส์ และใช้แถบเลื่อนสองแถบ แตะสีด้านล่างเพื่อเปลี่ยนสีนั้น</p><div id="ownsw">${ownSwatches()}</div><div class="card${arr(ME,'palette').includes('own')?' mine':''}" style="margin-top:auto">${pk('palette','own')}</div></div></div>`}});

/* neutral colours: the whole card is painted in each set, so the difference shows at a glance */
function neutralCard(n,cur){/* the neutral set's colours across the top, then one app box from Today to Address drawn in them */
  const P=cur.P,dark=isDark(n.bg),surf=dark?mixHex(n.bg,n.ink,.09):'#FFFFFF',mine=arr(ME,'neutral').includes(n.id);
  const sw=`<div class="ntsw">${[['Background','พื้นหลัง',n.bg,1],['Lines','เส้น',n.line],['Quiet text','ตัวอักษรรอง',n.mute],['Text','ตัวอักษร',n.ink]].map(([k,t,h,big])=>`<div class="${big?'big':''}" style="background:${h};color:${textOn(h)};box-shadow:inset 0 0 0 1px ${dark?'rgba(255,255,255,.12)':'rgba(0,0,0,.08)'}"><span>${k}</span><span class="th">${t}</span><span>${h}</span></div>`).join('')}</div>`;
  const box=`<div class="ntbox" style="background:${n.bg};color:${n.ink};border-color:${n.line}"><div class="nth2"><b style="font-size:17px">Today · วันนี้</b><span style="color:${n.mute};font-size:12.5px;text-align:right">Monday, 11:30<span class="th" style="display:block;font-size:11.5px">วันจันทร์ 11:30 น.</span></span></div><div style="background:${surf};border:1px solid ${n.line};border-radius:12px;padding:12px;display:grid;gap:6px"><b style="font-size:15px">Green curry with brown rice</b><span style="color:${n.mute};font-size:13px">แกงเขียวหวานข้าวกล้อง · 520 กิโลแคลอรี</span><span style="height:1px;background:${n.line}"></span><span style="display:flex;justify-content:space-between;align-items:center"><span style="color:${contrast(P.d,n.bg)>=3?P.d:r300(P.p)};font-weight:600;font-size:13px">PintoBox</span><span style="background:${P.p};color:${textOn(P.p)};border-radius:8px;padding:4px 12px;font-size:12px;font-weight:600">View · ดู</span></span></div>${[['Delivery days','วันจัดส่ง','Mon to Fri','จันทร์ถึงศุกร์'],['Address','ที่อยู่','Sathorn','สาทร']].map(([a,at,b,bt])=>`<div class="ntrow" style="border-top:1px solid ${n.line}"><span>${a} <span class="th" style="font-size:12px;color:${n.mute}">${at}</span></span><span style="color:${n.mute}">${b} <span class="th" style="font-size:12px">${bt}</span></span></div>`).join('')}</div>`;
  const pick=pk('neutral',n.id).replace(/<\/div>$/,`<span class="ntname">${esc(n.name)} <span class="th">${n.th}</span></span></div>`);
  return `<div class="card ntr3${locked('neutral',n.id)}${mine?' mine':''}">${sw}<div class="ntwrap">${box}${mockCap()}</div>${pick}</div>`}
[0,1].forEach(k=>add({sec:'colour',sets:['neutral'],kick:`${k+1} of 2`,title:'Neutral colours',th:'สีกลาง',lead:['Neutral colours are for backgrounds, lines and text, everywhere in the app. Pick one set.','สีกลางใช้กับพื้นหลัง เส้น และตัวอักษร ทั่วทั้งแอป เลือก 1 ชุด'],body:cur=>`<div class="grid c3 ntrg">${NEUTRALS.slice(k*3,k*3+3).map(n=>neutralCard(n,cur)).join('')}</div>`}));

const CHECK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function swChip(s){const hex=s[0],name=s[1],tname=s[2]||'';const on=arr(ME,'swatch').includes(hex),fin=arr('final','swatch').includes(hex);return `<div class="swc${on?' on':''}${fin?' locked':''}" data-set="swatch" data-opt="${hex}"><button type="button" class="pickb" data-act="pick" aria-pressed="${on}" aria-label="Pick ${esc(name)}"><span class="blk" style="background:${hex}"></span><span class="tx"><b>${esc(name)}</b><small class="th">${tname}</small><span>${hex}</span></span></button>${on?`<span class="ck" style="color:${textOn(hex)}">${CHECK}</span>`:''}</div>`}
function pickedStrip(){const a=arr(ME,'swatch');return `<div class="swpicked"><span class="lbl">Your extra colours · สีเพิ่มเติมของคุณ · ${a.length} of 16</span><span class="swdots">${a.length?a.map(h=>{const w=SWALL.find(x=>x[0]===h);return `<i style="background:${h}" title="${esc(w?w[1]:h)}"></i>`}).join(''):'<span class="mute" style="font-size:12.5px">None yet · ยังไม่ได้เลือก</span>'}</span></div>`}
[[0,2],[2,6]].forEach(([a,b],k)=>add({sec:'colour',kick:`${k+1} of 2`,title:'Extra colours',th:'สีเพิ่มเติม',lead:['Extra colours are for posts, stickers and food labels. Pick up to sixteen.','สีเพิ่มเติมใช้กับโพสต์ สติกเกอร์ และฉลากอาหาร เลือกได้สูงสุด 16 สี'],body:()=>`<div class="${k?'swg2':''}" style="display:grid;gap:12px">${SWATCHES.slice(a,b).map(([n,t,list])=>`<div class="swfam"><h4>${esc(n)} <small class="th mute" style="font-weight:400">${t}</small></h4><div class="swrow${k===0?' big':''}">${list.map(swChip).join('')}</div></div>`).join('')}${pickedStrip()}</div>`}));

function stateCard(st0,cur){const N=cur.N,P=cur.P;const st=st0.id==='brand'?Object.assign({},st0,{c:{ok:P.p,warn:P.a,bad:'#B33A1A',info:P.d}}):st0;const near=dE(st.c.ok,P.p);const steps=[['ok','Ordered','สั่งแล้ว'],['info','Cooking','กำลังทำอาหาร'],['warn','On the way','กำลังจัดส่ง'],['ok','Delivered','ส่งถึงแล้ว']];
  return card('states',st.id,`<div style="background:${N.bg};padding:9px 12px;display:grid;gap:7px"><div style="display:flex;gap:6px;flex-wrap:wrap">${[['ok','Delivered','ส่งถึงแล้ว'],['warn','Waiting for payment','รอชำระเงิน'],['bad','Payment failed','ชำระเงินไม่สำเร็จ'],['info','New menu','เมนูใหม่']].map(([k,en,th])=>`<span style="background:${st.c[k]};color:${textOn(st.c[k])};border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500">${en} · <span class="th">${th}</span></span>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">${steps.map(([k,en,th],i)=>`<div style="display:grid;gap:3px"><span style="height:7px;border-radius:4px;background:${i<3?st.c[k]:N.line}"></span><span style="font-size:11.5px;color:${N.ink}">${en}</span><span class="th" style="font-size:10.5px;color:${N.mute}">${th}</span></div>`).join('')}</div></div>`,esc(st.name)+thsmall(st.th),dsc(st.story,st.sth),`<div class="facts"><span>Done green next to our main colour: ${near<10?'<span class="no">too similar, people may mix them up</span>':'<span class="ok">easy to tell apart</span>'}<span class="th fth">สีเขียวที่บอกว่าเสร็จแล้ว เทียบกับสีหลักของเรา ${near<10?'ใกล้กันเกินไป คนอาจสับสน':'แยกออกจากกันได้ง่าย'}</span></span></div>`)}
[0,1].forEach(k=>add({sec:'colour',kick:`${k+1} of 2`,title:'Status colours',th:'สีสถานะ',lead:['Status colours show what is happening, like a finished order or a failed payment.','สีสถานะบอกว่าเกิดอะไรขึ้น เช่น ส่งถึงแล้ว หรือชำระเงินไม่สำเร็จ'],body:cur=>`<div class="grid c2 stg">${STATES.slice(k*4,k*4+4).map(s=>stateCard(s,cur)).join('')}</div>`}));

add({sec:'colour',title:'Light to dark',th:'ไล่ระดับสีจากอ่อนไปเข้ม',side:cur=>`<span class="mono" style="font-size:12px;color:var(--mute)">${esc(cur.P.name)} · ${cur.P.th||''}</span>`,lead:['Ten steps of your palette for backgrounds, borders and text. There is nothing to pick.','ชุดสีของคุณไล่เป็น 10 ระดับ สำหรับพื้นหลัง เส้นขอบ และตัวอักษร หน้านี้ไม่ต้องเลือก'],body:cur=>{const P=cur.P;return `<div class="rampwrap tall">${[['Main','สีหลัก',P.p],['Accent','สีเน้น',P.a],['Accent 2','สีเน้น 2',P.a2||P.a],['Deep','สีเข้ม',P.d]].map(([n,t,h])=>{const r=ramp(h);return `<div><h4>${n} <span class="th" style="font-weight:400">${t}</span> · <span class="mono">${h}</span></h4><div class="ramp">${r.map(s=>{const tw=contrast('#FFFFFF',s.hex),tk=contrast(DARKTXT,s.hex);return `<div class="${s.base?'base':''}" style="background:${s.hex};color:${textOn(s.hex)}"><span>${s.step}${s.base?'<span class="ours1"> · ours · ในชุดสี</span>':''}</span><span>${s.hex}<br>${tw>=4.5?'white text<br><span class="th">ตัวอักษรสีขาว</span>':tk>=4.5?'dark text<br><span class="th">ตัวอักษรสีเข้ม</span>':'big text only<br><span class="th">เฉพาะตัวอักษรใหญ่</span>'}</span>${s.base?'<span class="ours2">ours · <span class="th">ในชุดสี</span></span>':''}</div>`}).join('')}</div></div>`}).join('')}</div>`}});

/* last in the section: the colour the person picked, next to the colours of the food apps */
add({sec:'colour',title:'Your colour next to the food apps',th:'สีของคุณเทียบกับแอปส่งอาหาร',lead:['Your main colour next to the food apps in Thailand and around the world.','สีหลักของคุณเทียบกับแอปส่งอาหารในไทยและทั่วโลก'],body:cur=>{const P=cur.P,picked=arr(ME,'palette').length>0,nt=nearestApp(P.p),all=worldOn()?nearestApp(P.p,APPS.concat(WORLD_APPS)):nt,w=closeWord(all.d),wt=closeWord(nt.d);
  const note=picked?'':`<p class="wnote">You have not picked a palette yet, so this page shows ${esc(P.name)}. <span class="th">คุณยังไม่ได้เลือกชุดสี หน้านี้จึงแสดง ${esc(P.name)}</span></p>`;
  const thai=all.n===nt.n?'':`<span style="font-size:13px">The nearest app in Thailand is ${esc(nt.n)}, at ${fmt1(nt.d)}, <b class="${wt[2]}">${wt[0]}</b>.</span>`;
  const tog=`<div class="wleg"><span><i class="sq"></i>In Thailand · ในไทย</span><span><i class="dot"></i>Around the world · ทั่วโลก</span><button type="button" class="vbtn" id="worldTog" aria-pressed="${worldOn()}">${worldOn()?'Hide the world apps · ซ่อนแอปจากทั่วโลก':'Show the world apps · แสดงแอปจากทั่วโลก'}</button></div>`;
  return `<div class="wheelg"><div class="wheelbox">${hueWheel(P)}</div><div class="wheelside"><div class="bcard" style="padding:12px 16px;gap:8px"><div style="display:flex;gap:14px;align-items:center"><span class="hlsw" style="background:linear-gradient(90deg,${P.d} 0 25%,${P.p} 25% 70%,${P.a} 70%)"></span><span style="display:grid;gap:2px"><b style="font-size:16px">${picked?'Your palette: ':''}${esc(P.name)} <small class="th mute" style="font-weight:400">${P.th||''}</small></b><span style="font-size:13.5px">Your main colour is <b class="${w[2]}">${w[0]}</b> to ${esc(all.n)}, the nearest food app, at ${fmt1(all.d)} on our colour scale.</span>${thai}<span class="th" style="font-size:12.5px;color:var(--mute)">สีหลักของคุณ${nearTh(all.d,esc(all.n))} ซึ่งเป็นแอปส่งอาหารที่ใกล้ที่สุด ห่างกัน ${fmt1(all.d)} ตามมาตรวัดสีของเรา${all.n===nt.n?'':` ส่วนแอปในไทยที่ใกล้ที่สุดคือ ${esc(nt.n)} ห่างกัน ${fmt1(nt.d)}`}</span></span></div>${note}</div>${tog}<div class="bcard dlist" style="padding:10px 14px;gap:2px"><div class="lbl">Distance from your main colour, nearest first · ระยะห่างจากสีหลักของคุณ เรียงจากใกล้ที่สุด</div>${appDistances(P)}</div><p class="src" style="margin:0">Around the wheel is the colour, and out from the centre is how light it is. Squares are apps in Thailand and dots are apps around the world, with colours that are close matches from public colour listings. The number is colour distance in OKLab times 100, where under 8 is very close and under 15 is close.<br><span class="th">รอบวงล้อคือสี และระยะจากกลางวงออกไปคือความอ่อนของสี สี่เหลี่ยมคือแอปในไทย และจุดกลมคือแอปจากทั่วโลก สีของแอปเป็นสีที่ใกล้เคียงจากรายการสีที่เผยแพร่ทั่วไป ตัวเลขคือระยะห่างของสีในระบบ OKLab คูณ 100 ต่ำกว่า 8 คือใกล้มาก และต่ำกว่า 15 คือค่อนข้างใกล้</span></p></div></div>`}});

/* logo section: after the colours, so every logo is drawn in the person's palette, with the steel carrier in steel grey.
   A logo opens nothing when tapped; the heart is the only button on a logo, and the idea behind a logo is shown once,
   on the page for the final logo. Every logo page has the colour dots in its footer. */
const lpos=(cur,bg)=>lmap(cur.c,'pos',bg||'#FFFFFF');
add({sec:'logo',pal:true,title:'Eleven logo ideas',th:'โลโก้ใหม่ 11 แบบ',lead:['Eleven ideas in your colours. Tap the heart on every logo you like.','โลโก้ 11 แบบในสีของคุณ กดหัวใจที่โลโก้ทุกแบบที่คุณชอบ'],body:cur=>{
  const today=`<div class="lc${liked('l0')?' liked':''}"><div class="lgo"><span class="art">${todayImg(70,12)}</span><span class="cap"><span class="mono">0</span>Our logo today · โลโก้ที่ใช้อยู่ตอนนี้</span></div>${heart('l0','Our logo today')}</div>`;
  const cells=LOGOS.map((L,i)=>`<div class="lc${liked(L.id)?' liked':''}"><div class="lgo"><span class="art">${lsvg(L.lock,lpos(cur),lh(L,36,58,80))}</span><span class="cap"><span class="mono">${i+1}</span><span class="capn">${esc(L.name)}<small class="th">${L.th}</small></span><span class="mute capt">${LTYPE[L.type]}<small class="th">${LTYPETH[L.type]}</small></span></span></div>${heart(L.id,L.name)}</div>`).join('');
  return `<div class="grid c4 lgrid">${today}${cells}</div>`}});

add({sec:'logo',pal:true,title:'All eleven side by side',th:'เทียบโลโก้ทั้ง 11 แบบ',lead:['Each logo as an app icon at three sizes, in one colour and on your main colour.','โลโก้ทุกแบบในรูปไอคอนแอป 3 ขนาด แบบสีเดียว และบนสีหลักของคุณ'],body:cur=>{const c=cur.c;
  const row=(label,f,bg)=>`<div class="sbs-row"><span class="lbl">${label}</span>${LOGOS.map(L=>`<div class="sbs-cell" style="${bg?'background:'+bg:''}">${f(L)}</div>`).join('')}</div>`;
  /* on a phone the table turns round: one logo per row, with the same sizes, so nothing has to scroll sideways */
  const list=`<div class="sbl">${LOGOS.map((L,i)=>`<div class="sbl-r"><div class="sbl-h"><span class="mono" style="color:var(--brass)">${i+1}</span><b>${esc(L.name)}</b><small class="th">${L.th}</small>${heart(L.id,L.name)}</div><div class="sbl-c"><span>${licon(L,c,64)}<i>64</i></span><span>${licon(L,c,40)}<i>40</i></span><span>${licon(L,c,24)}<i>24</i></span><span class="w">${lsvg(L.mark,lmap(c,'one'),44)}<i>One colour<span class="th">สีเดียว</span></i></span><span class="w" style="background:${c.p}">${lsvg(L.mark,lmap(c,'rev',c.p),44)}<i style="color:${textOn(c.p)}">On your colour<span class="th">บนสีหลักของคุณ</span></i></span></div></div>`).join('')}</div>`;
  return `${list}<div class="sbs"><div class="sbs-row"><span></span>${LOGOS.map((L,i)=>`<span class="sbs-head"><span class="mono" style="color:var(--brass)">${i+1}</span> ${esc(L.name)}<small class="th">${L.th}</small></span>`).join('')}</div><div class="sbs-row hearts"><span class="lbl">Like · ชอบ</span>${LOGOS.map(L=>`<div class="sbs-h">${heart(L.id,L.name)}</div>`).join('')}</div>${row('App icon 64<span class="th">ไอคอนแอป 64</span>',L=>licon(L,c,64))}${row('App icon 40<span class="th">ไอคอนแอป 40</span>',L=>licon(L,c,40))}${row('App icon 24<span class="th">ไอคอนแอป 24</span>',L=>licon(L,c,24))}${row('One colour<span class="th">สีเดียว</span>',L=>lsvg(L.mark,lmap(c,'one'),48),'#FFFFFF')}${row('On your colour<span class="th">บนสีหลักของคุณ</span>',L=>lsvg(L.mark,lmap(c,'rev',c.p),48),c.p)}</div>`}});

const finalBtn=(id,name)=>{const on=arr(ME,'final').includes(id);return `<span class="fk" data-set="final" data-opt="${id}"><button type="button" class="fbtn" data-act="pick" aria-pressed="${on}" aria-label="${on?'Final logo':'Choose as final logo'}: ${esc(name)}">${on?'✓ Final logo · โลโก้สุดท้าย':'Choose as final · เลือกเป็นโลโก้สุดท้าย'}</button></span>`};
let favPage=0;
favPage=add({sec:'logo',pal:true,sets:['final'],title:'Your favourite logos',th:'โลโก้ที่คุณชอบ',lead:['These are the logos you liked. Choose your final logo here.','นี่คือโลโก้ที่คุณกดหัวใจไว้ เลือกโลโก้สุดท้ายได้ที่หน้านี้'],body:cur=>{
  const ids=arr(ME,'logo');
  if(!ids.length)return `<div class="favempty"><span class="fe-heart" aria-hidden="true">🤍</span><b>You have not liked any logo yet.</b><span class="th">คุณยังไม่ได้กดหัวใจให้โลโก้ไหนเลย</span><p>Go back to the logos and tap the heart on every one you like. They will wait for you here.</p><p class="th">กลับไปที่หน้าโลโก้ แล้วกดหัวใจที่ทุกแบบที่คุณชอบ โลโก้เหล่านั้นจะมารออยู่ที่หน้านี้</p><button type="button" class="btn" data-go="${firstOf.logo}">See the logos · ดูโลโก้</button></div>`;
  /* the fewer logos liked, the bigger each one is drawn, with its app icon underneath */
  const n=ids.length,cols=n<=3?n:n===4?4:n<=6?3:n<=8?4:6,big=n<=4,mid=n<=8,isz=big?52:mid?38:0;
  const cells=ids.map(id=>{const L=LOGOS.find(l=>l.id===id),name=L?L.name:'Our logo today',no=L?LOGOS.indexOf(L)+1:0,fin=arr(ME,'final').includes(id);
    const art=L?lsvg(L.lock,lpos(cur),big?lh(L,62,100,140):mid?lh(L,36,62,88):lh(L,22,40,56)):todayImg(big?120:mid?84:56,12);
    const mini=L&&isz?`<div class="fav-mini">${licon(L,cur.c,isz)}<span class="mute" style="font-size:11.5px">App icon · ไอคอนแอป</span></div>`:'';
    return `<div class="card favc${fin?' mine':''}"><div class="fav-art">${art}${mini}</div><div class="favf"><span class="favn"><span class="mono" style="color:var(--brass)">${no}</span> ${esc(name)}<small class="th">${L?L.th:'โลโก้ที่ใช้อยู่ตอนนี้'}</small></span>${heart(id,name)}</div><div class="favp">${finalBtn(id,name)}</div></div>`}).join('');
  return `<div class="grid favg" style="grid-template-columns:repeat(${cols},minmax(0,${n<=3?'380px':'1fr'}));justify-content:center">${cells}</div>`}});

/* the final logo in full: the idea, the app icon, a box, a phone and the small sizes, for the one logo chosen */
add({sec:'logo',pal:true,title:'Your final logo',th:'โลโก้สุดท้ายของคุณ',lead:['Your final logo in full, with the idea behind it.','โลโก้สุดท้ายของคุณแบบเต็ม พร้อมไอเดียเบื้องหลัง'],body:cur=>{
  const fid=arr(ME,'final')[0],c=cur.c;
  const back=`<button type="button" class="btn" data-go="${favPage}">Your favourite logos · โลโก้ที่คุณชอบ</button>`;
  if(!fid)return `<div class="favempty"><span class="fe-heart" aria-hidden="true">🤍</span><b>You have not chosen a final logo yet.</b><span class="th">คุณยังไม่ได้เลือกโลโก้สุดท้าย</span><p>Choose it on the page before. This page then shows it in full.</p><p class="th">เลือกได้ในหน้าก่อนหน้า แล้วหน้านี้จะแสดงโลโก้นั้นแบบเต็ม</p>${back}</div>`;
  if(fid==='l0')return `<div class="favempty"><span>${todayImg(150,22)}</span><b>You chose to keep our logo today.</b><span class="th">คุณเลือกใช้โลโก้ที่เราใช้อยู่ตอนนี้</span>${back}</div>`;
  const L=LOGOS.find(l=>l.id===fid);if(!L)return `<div class="favempty">${back}</div>`;const i=LOGOS.indexOf(L);
  return `<div class="lone"><div class="left"><div class="hero" style="background:#FFFFFF">${lsvg(L.lock,lpos(cur),lh(L,104,160,230))}</div><div class="pair"><div style="background:${c.p}"><span class="lab" style="color:${textOn(c.p)}">On your main colour · บนสีหลักของคุณ</span>${lsvg(L.lock,lmap(c,'rev',c.p),lh(L,48,80,118))}</div><div class="kraft"><span class="lab" style="color:#5A4128">Printed on a kraft box · พิมพ์บนกล่องกระดาษคราฟต์</span><div class="lid">${lsvg(L.lock,lmap(c,'one'),lh(L,40,70,104),'stamp')}</div></div></div></div><div class="right"><div class="idea"><div class="num">Idea ${i+1} · ${esc(L.name)} · <span class="th">${L.th}</span> · ${LTYPE[L.type]} · <span class="th">${LTYPETH[L.type]}</span></div><p>${esc(L.story)}</p><p class="th" style="font-size:13.5px;color:var(--mute)">${LSTORY_TH[L.id]||''}</p><div class="meta"><span class="tag">Lettering in ${esc(L.font)} · <span class="th">ตัวอักษร ${esc(L.font)}</span></span><span class="tag">Drawn for PintoBox · <span class="th">วาดขึ้นเพื่อ PintoBox</span></span><span class="idpk"><span class="finok">✓ Final logo · โลโก้สุดท้าย</span></span></div></div><div class="showcase"><div class="phw">${phone(L,c,null,1)}${mockCap()}</div><div class="sizes"><div class="lbl">App icon at three sizes · ไอคอนแอป 3 ขนาด</div><div class="row">${licon(L,c,64)}${licon(L,c,40)}${licon(L,c,24)}</div><div class="lbl">Small, at the top of a web page · ขนาดเล็กบนหัวเว็บไซต์</div><div style="background:#FFFFFF;border:1px solid #E2E2E0;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px">${lsvg(L.lock,lpos(cur),lh(L,20,30,38))}<span style="display:flex;gap:6px;font-size:9px;color:#6B6B6B"><span>Plans · แผน</span><span>Kitchens · ครัว</span></span></div></div></div><div class="vars"><div><span class="lbl">The symbol alone · สัญลักษณ์อย่างเดียว</span><div class="vbox" style="background:#FFFFFF">${lsvg(L.mark,lpos(cur),56)}</div></div><div><span class="lbl">Profile picture · รูปโปรไฟล์</span><div class="vbox" style="background:#FFFFFF"><span style="width:56px;height:56px;border-radius:50%;overflow:hidden;display:block">${licon(L,c,56)}</span></div></div><div><span class="lbl">On your deep colour · บนสีเข้มของคุณ</span><div class="vbox" style="background:${c.d}">${lsvg(L.mark,lmap(c,'rev',c.d),56)}</div></div></div></div></div>`}});

add({sec:'logo',pal:true,sets:['mascot'],title:'A character',th:'ตัวละคร',lead:['Should PintoBox have a character? Pick one answer.','PintoBox ควรมีตัวละครไหม เลือก 1 คำตอบ'],body:cur=>{
  const k1=LOGOS.find(l=>l.id==='k1'),k10=LOGOS.find(l=>l.id==='k10'),c=cur.c;
  const art={yes:`<div class="masc-art col"><span>${lsvg(k10.mark,lpos(cur),150)}</span><span>${lsvg(k10.lock,lpos(cur),46)}</span></div>`,
   posts:`<div class="masc-art col"><span class="poses">${['wave','sleep','sign'].map(k=>`<svg viewBox="-6 -2 124 102" width="116" height="95" aria-hidden="true">${friendPose(c,k)}</svg>`).join('')}</span><span>${lsvg(k1.lock,lpos(cur),46)}</span></div>`,
   no:`<div class="masc-art col"><span>${lsvg(k1.mark,lpos(cur),150)}</span><span>${lsvg(k1.lock,lpos(cur),46)}</span></div>`};
  return `<div class="grid c3 mascg">${MASCOT.map(([id,n,th,d,dt])=>card('mascot',id,art[id],esc(n)+thsmall(th),dsc(d,dt))).join('')}</div>`}});

/* logo layout, built from the person's own first logo and shown in their colours */
const layLogo=()=>{const Ls=topLogos(3);return Ls.find(L=>L.id===VIEW.layL)||Ls[0]};
add({sec:'layout',pal:true,sets:['arrange','emphasis'],title:'How your logo is laid out',th:'การวางโลโก้ของคุณ',lead:['Made from your first logo and your colours. Pick how it sits and which name is bigger.','สร้างจากโลโก้แบบแรกและสีของคุณ เลือกวิธีวางโลโก้ และชื่อภาษาไหนที่ใหญ่กว่า'],body:cur=>{const c=cur.c,L=layLogo(),a=curArr(),e=curEmph(),bg=c.l;
  const Ls=topLogos(3);const sw=Ls.length>1?`<div class="laysw"><span class="lbl">Your logos · โลโก้ของคุณ</span>${Ls.map(x=>`<button type="button" class="vbtn" data-layl="${x.id}" aria-pressed="${x.id===L.id}">${esc(x.name)} <span class="th">${x.th}</span></button>`).join('')}</div>`:`<div class="laysw"><span class="lbl">Built from · สร้างจาก</span><b style="font-size:13px">${esc(L.name)} <span class="th" style="font-weight:400">${L.th}</span></b></div>`;
  const big=`<div class="layprev" style="background:${bg}">${lockup(L,c,a,e,a==='mark'?190:a==='stack'?250:150,bg)}</div><div class="laydark" style="background:${c.d}">${lockup(L,c,a,e,a==='mark'?74:a==='stack'?96:58,c.d,'rev')}</div>`;
  const ac=ARRANGE.map(([id,n,th,d])=>card('arrange',id,`<div class="layth" style="background:${N0(cur)}">${lockup(L,c,id,e,id==='stack'?88:id==='mark'?70:46,N0(cur))}</div>`,esc(n)+thsmall(th),'','',true)).join('');
  const ea=a==='mark'?'left':a;const ec=EMPHASIS.map(([id,n,th])=>card('emphasis',id,`<div class="layth sm" style="background:${N0(cur)}">${lockup(L,c,ea,id,ea==='stack'?70:34,N0(cur))}</div>`,esc(n)+thsmall(th),'','',true)).join('');
  return `<div class="lay"><div class="layl">${big}${sw}</div><div class="layr"><div class="lbl">How the symbol and name sit · การวางสัญลักษณ์กับชื่อ</div><div class="grid c4">${ac}</div><div class="lbl" style="margin-top:4px">Which name is bigger · ชื่อภาษาไหนใหญ่กว่า</div><div class="grid c5">${ec}</div></div></div>`}});
function N0(cur){return cur.N.bg}
add({sec:'layout',pal:true,title:'Your logo in use',th:'โลโก้ของคุณเมื่อใช้งานจริง',lead:['Your logo, laid out the way you picked. There is nothing to pick on this page.','โลโก้ของคุณตามแบบการวางที่คุณเลือก หน้านี้ไม่ต้องเลือกอะไร'],body:cur=>{const c=cur.c,L=layLogo(),a=curArr(),e=curEmph();
  const lk=(h,bg,mode)=>lockup(L,c,a,e,h,bg,mode);
  const splash=`<div class="mk2 hascap" style="background:#E9ECE8"><div class="mini-ph" style="background:${c.d}">${lockup(L,c,a==='mark'?'mark':'stack',e,a==='mark'?60:96,c.d,'rev')}</div><span class="mk2l">App opening screen · หน้าเปิดแอป</span>${mockCap()}</div>`;
  const bag=`<div class="mk2" style="background:#F3EEE6"><svg viewBox="0 0 160 170" width="150" height="160" aria-hidden="true"><path d="M22 46h116l10 116H12z" fill="#C9A27A"/><path d="M22 46h116l-3 12H25z" fill="#B38D66"/><path d="M56 46c0-26 48-26 48 0" fill="none" stroke="#8B6B4A" stroke-width="5"/></svg><div class="bagmark2">${lk(a==='stack'?66:a==='mark'?50:30,'#C9A27A','ink')}</div><span class="mk2l">Paper bag · ถุงกระดาษ</span></div>`;
  const box=`<div class="mk2" style="background:${mixHex(c.p,'#FFFFFF',.85)}"><div class="boxlid" style="background:#FFFFFF"><div style="background:${c.l};border-radius:10px;padding:14px 16px;display:grid;place-items:center">${lk(a==='stack'?74:a==='mark'?60:34,c.l)}</div><div class="boxlbl" style="color:${c.d}"><span>Green curry · แกงเขียวหวาน</span><span>Use by 7 Nov · ควรบริโภคก่อน 7 พ.ย.</span></div></div><span class="mk2l">Box label · ฉลากบนกล่อง</span></div>`;
  const sticker=`<div class="mk2" style="background:repeating-linear-gradient(45deg,#EEF1EC 0 10px,#E6EAE5 10px 20px)"><span class="stk2" style="background:${c.l}">${lockup(L,c,a==='left'||a==='right'?'stack':a,e,a==='mark'?70:82,c.l)}</span><span class="mk2l">Round sticker · สติกเกอร์วงกลม</span></div>`;
  const post=`<div class="mk2" style="background:#E9ECE8"><div class="post2" style="background:${c.p}"><div style="position:absolute;left:12px;top:12px">${lk(a==='stack'?46:a==='mark'?36:22,c.p,'rev')}</div><div style="position:absolute;left:12px;right:12px;bottom:12px;color:${textOn(c.p)}"><div style="font-family:${cur.F.dis};font-weight:${cur.F.dw};font-size:17px;line-height:1.15">Good food, every week</div><div class="th" style="font-size:12px;opacity:.9">อาหารดี ส่งถึงทุกสัปดาห์</div></div><span style="position:absolute;right:12px;top:40px;width:64px;height:64px;border-radius:50%;background:${c.a};opacity:.9"></span></div><span class="mk2l">Post · โพสต์</span></div>`;
  const sign=`<div class="mk2" style="background:#E3E7E2"><div class="sign2" style="background:${c.d}">${lk(a==='stack'?70:a==='mark'?56:36,c.d,'rev')}</div><span class="mk2l">Shop sign · ป้ายร้าน</span></div>`;
  return `<div class="grid c3 inuse2">${splash}${bag}${box}${sticker}${post}${sign}</div>`}});

/* fonts */
function fontCard(F,c,N){return card('font',F.id,`<div class="specimen" style="background:${N.bg};color:${N.ink}"><div style="font-family:${F.dis};font-weight:${F.dw};font-size:40px;line-height:1.15;color:${isDark(N.bg)?c.l:c.d}">PintoBox <span style="color:${c.p}">ปิ่นโต</span></div><div style="font-family:${F.dis};font-weight:${F.dw};font-size:22px;line-height:1.4">อาหารดีทุกสัปดาห์ จากครัวที่คุณเลือก</div><div style="font-family:${F.dis};font-weight:${F.dw};font-size:19px;line-height:1.3">Good meals every week, from kitchens you choose</div><div style="font-family:${F.body};font-weight:${F.bw};font-size:15.5px;line-height:1.6">เลือกแผน 5 หรือ 10 มื้อ แล้วเลือกวันจัดส่งของคุณ<br>Choose a plan of 5 or 10 meals and pick your delivery days.</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-family:${F.body};font-weight:${F.bw};font-size:13px;color:${N.mute}">฿79 ต่อมื้อ · 520 กิโลแคลอรี</span><span style="font-family:${F.dis};font-weight:${F.dw};background:${c.p};color:${textOn(c.p)};border-radius:9px;padding:5px 12px;font-size:13px">สมัครแผนนี้ · Subscribe</span></div></div>`,esc(F.name)+(F.th?thsmall(F.th):''),dsc(F.story,F.sth))}
[0,1,2].forEach(k=>add({sec:'type',sets:['font'],kick:`${k+1} of 3`,title:'Nine font pairs, Thai and English',th:'ฟอนต์ไทยและอังกฤษ 9 คู่',lead:k?['More pairs. Pick one pair across the three pages.','คู่ฟอนต์เพิ่มเติม เลือก 1 คู่จากทั้ง 3 หน้า']:['Each card shows a heading, Thai, English and body text. Pick one pair.','แต่ละการ์ดมีหัวข้อ ภาษาไทย ภาษาอังกฤษ และเนื้อความ เลือก 1 คู่'],body:cur=>`<div class="grid c3 fntg">${FONTS.slice(k*3,k*3+3).map(F=>fontCard(F,cur.c,cur.N)).join('')}</div>`}));

/* icons */
add({sec:'icons',sets:['iconstyle'],title:'Eight icon styles',th:'สไตล์ไอคอน 8 แบบ',lead:['Ten icons in eight styles, from free icon sets and our own drawing. Pick one or two.','ไอคอน 10 ตัวใน 8 สไตล์ จากชุดไอคอนฟรีและลายเส้นที่เราวาดเอง เลือก 1 หรือ 2 แบบ'],body:cur=>{const c=cur.c,N=cur.N;
  return `<div class="grid c4 istg">${ICONSTYLES.map(([id,n,th,d,dt,kit])=>card('iconstyle',id,`<div class="isamp" style="background:${N.bg}">${ISAMPLE.map(([nm,lab])=>`<span title="${lab}">${ic(nm,id,c,{size:27,col:isDark(N.bg)?c.l:c.d,label:lab,alt:IALT[nm]})}</span>`).join('')}</div>`,esc(n)+thsmall(th),dsc(d,dt),`<span class="tag" style="justify-self:start">${esc(kit)}</span>`)).join('')}</div><p class="src" style="margin-top:8px">${ICONCREDIT}<br><span class="th">${ICONCREDITTH}</span></p>`}});
const phoneIst=()=>VIEW.phoneStyle||resolve('iconstyle',['line'])[0];
add({sec:'icons',title:'Your icons on a phone',th:'ไอคอนของคุณบนโทรศัพท์',lead:['The phones use your first icon style and your colours. Tap a style to compare it.','โทรศัพท์ใช้สไตล์ไอคอนแรกที่คุณเลือกและสีของคุณ แตะสไตล์อื่นเพื่อเปรียบเทียบ'],body:cur=>{const st=phoneIst(),g=uiCfg(cur,{ist:st}),mine=arr(ME,'iconstyle');
  const list=ICONSTYLES.map(([id,n,th])=>`<button type="button" class="psb${id===st?' on':''}" data-ps="${id}" aria-pressed="${id===st}"><span class="psi">${['tiffin','scooter','bell'].map(x=>ic(x,id,cur.c,{size:20,alt:IALT[x]})).join('')}</span><span class="psn"><b>${esc(n)}</b><small class="th">${th}</small></span>${mine.includes(id)?'<span class="tag" style="margin-left:auto">Your pick · ที่คุณเลือก</span>':''}</button>`).join('');
  return `<div class="phg"><div class="phs">${screenHome(g)}${screenTrack(g)}</div><div class="psl"><div class="lbl">Icon style on the phones · สไตล์ไอคอนบนโทรศัพท์</div>${list}</div></div>`}});
const ICHUNK=(()=>{const out=[];let cur=[],h=0;IG.forEach(g=>{const gh=32+Math.ceil(g[2].length/12)*64;if(h+gh>420&&cur.length){out.push(cur);cur=[];h=0}cur.push(g);h+=gh});if(cur.length)out.push(cur);return out})();
const listStyle=()=>VIEW.listStyle||resolve('iconstyle',['line'])[0];
ICHUNK.forEach((groups,k)=>add({sec:'icons',kick:`${k+1} of ${ICHUNK.length}`,title:'Every icon the apps need',th:'ไอคอนทั้งหมดที่แอปต้องใช้',lead:['Each icon in the style picked at the top. A dot marks our own drawing where a set has none.','ไอคอนแสดงในสไตล์ที่เลือกด้านบน จุดเล็ก ๆ คือไอคอนที่เราวาดเพิ่มเมื่อชุดนั้นไม่มี'],side:()=>{const st=listStyle();return `<div class="isel">${ICONSTYLES.map(([id,n])=>`<button type="button" class="vbtn" data-view="${id}" aria-pressed="${id===st}" title="${esc(n)}">${esc(ISHORT[id])} <span class="th">${ISHORTTH[id]}</span></button>`).join('')}</div>`},body:cur=>{const c=cur.c,st=listStyle();
  return `<div class="iconlist">${groups.map(([g,gt,items])=>`<div class="igroup"><h4>${esc(g)}<small class="th">${gt}</small></h4><div class="icells">${items.map(([kk,en,th])=>`<div class="icell${st!=='line'&&!hasKit(kk,st)?' fb':''}">${ic(kk,st,c,{size:28,label:en})}<span>${esc(en)}</span><span class="t">${th}</span></div>`).join('')}</div></div>`).join('')}</div>`}}));

/* app interface */
const uiOpt=(set,list,sample)=>`<div class="grid c${list.length} uig">${list.map(x=>ocard(set,x[0],sample(x),esc(x[1]),x[2])).join('')}</div>`;
add({sec:'ui',sets:['button','corner'],title:'Buttons and corners',th:'ปุ่มและความโค้งของมุม',lead:['How buttons look and how round the corners are. The phone follows your picks.','หน้าตาของปุ่มและความโค้งของมุม โทรศัพท์จะเปลี่ยนตามที่คุณเลือก'],body:cur=>{const g=uiCfg(cur);
  const bs=uiOpt('button',BUTTONS,([id])=>`<span style="${btnStyle(uiCfg(cur,{button:id}),id)};font-size:12px;padding:8px 14px">Subscribe · สมัคร</span>`);
  const cs=uiOpt('corner',CORNERS,([id,,,r])=>{const gg=uiCfg(cur,{corner:id});return `<div style="width:100%;background:#FFFFFF;border:1px solid ${cur.N.line};border-radius:${r}px;padding:8px;display:grid;gap:6px"><div style="height:26px;border-radius:${Math.max(2,r-4)}px;background:${cur.c.l}"></div><span style="${btnStyle(gg,'solid')};font-size:10.5px">Subscribe · สมัคร</span></div>`});
  return `<div class="uiw"><div class="uil"><div class="lbl">Button style · สไตล์ปุ่ม</div>${bs}<div class="lbl">Corner roundness · ความโค้งของมุม</div>${cs}</div><div class="uip">${screenHome(g)}</div></div>`}});
add({sec:'ui',sets:['cardstyle','shadow','tabbar'],title:'Cards, shadows and the tab bar',th:'การ์ด เงา และแถบเมนูล่าง',lead:['How cards look, their shadow, and the bar at the bottom. Pick one of each.','การ์ด เงา และแถบเมนูล่าง เลือกอย่างละ 1 แบบ'],body:cur=>{const g=uiCfg(cur),c=cur.c,N=cur.N;
  const cardS=uiOpt('cardstyle',CARDSTYLES,([id])=>{const gg=uiCfg(cur,{cardstyle:id,shadow:'flat'}),oc=onCard(gg);return `<div style="${cardStyle(gg)};width:100%">${id==='photo'?foodArt(c,'100%',30):''}<div style="padding:7px 9px;display:grid;gap:2px"><b style="font-size:11px;color:${oc.ink}">This week · สัปดาห์นี้</b><span style="font-size:9.5px;color:${oc.mute}">5 meals · 5 มื้อ</span></div></div>`});
  const shS=uiOpt('shadow',SHADOWS,([id])=>{const gg=uiCfg(cur,{shadow:id,cardstyle:'outline'});return `<div style="${cardStyle(gg)};width:78%;padding:9px 10px;display:grid;gap:2px"><b style="font-size:11px;color:${N.ink}">Week 2 plan · แผนสัปดาห์ที่ 2</b><span style="font-size:9.5px;color:${N.mute}">Mon to Fri · จันทร์ถึงศุกร์</span></div>`});
  const tbS=uiOpt('tabbar',TABBARS,([id])=>`<div class="tbmini">${tabBar(uiCfg(cur,{tabbar:id}),0)}</div>`).replace('uig"','uig tbg"');
  return `<div class="uiw"><div class="uil"><div class="lbl">Card style · สไตล์การ์ด</div>${cardS}<div class="lbl">Shadow · เงา</div>${shS}<div class="lbl">Tab bar · แถบเมนูล่าง</div>${tbS}</div><div class="uip">${screenHome(g)}</div></div>`}});
add({sec:'ui',title:'Your app, all together',th:'แอปของคุณเมื่อรวมทุกอย่าง',lead:['Three screens made from all your picks. Tap a row on the right to change it.','สามหน้าจอที่สร้างจากทุกอย่างที่คุณเลือก แตะรายการด้านขวาเพื่อเปลี่ยน'],body:cur=>{const g=uiCfg(cur);
  const fnd=(l,id)=>l.find(x=>x[0]===id)||[];
  const rows=[['palette','Palette · ชุดสี',cur.P.name,cur.P.th],['neutral','Neutrals · สีกลาง',cur.N.name,cur.N.th],['font','Fonts · ฟอนต์',cur.F.name,cur.F.th],['iconstyle','Icons · ไอคอน',fnd(ICONSTYLES,g.ist)[1],fnd(ICONSTYLES,g.ist)[2]],['button','Buttons · ปุ่ม',fnd(BUTTONS,g.btn)[1],fnd(BUTTONS,g.btn)[2]],['corner','Corners · ความโค้งของมุม',fnd(CORNERS,g.corner)[1],fnd(CORNERS,g.corner)[2]],['cardstyle','Cards · การ์ด',fnd(CARDSTYLES,g.card)[1],fnd(CARDSTYLES,g.card)[2]],['shadow','Shadows · เงา',fnd(SHADOWS,g.shadow)[1],fnd(SHADOWS,g.shadow)[2]],['tabbar','Tab bar · แถบเมนูล่าง',fnd(TABBARS,g.tab)[1],fnd(TABBARS,g.tab)[2]]];
  const goto=set=>{const i=DECK.findIndex(s=>s.sets&&s.sets.includes(set));return i<0?firstOf[SETS[set].sec]:i};
  return `<div class="allg"><div class="phs three">${screenHome(g)}${screenPlan(g)}${screenTrack(g)}</div><div class="allp"><div class="lbl">Made from · สร้างจาก</div>${rows.map(([set,lab,v,vt])=>`<button type="button" class="allr" data-go="${goto(set)}"><span>${lab}</span><b>${esc(v||'')}${vt?` <span class="th" style="font-weight:400">${vt}</span>`:''}</b><span class="mute" style="font-size:11px">${arr(ME,set).length?'yours · ที่คุณเลือก':'not picked yet · ยังไม่ได้เลือก'}</span></button>`).join('')}</div></div>`}});

[0,1,2].forEach(k=>add({sec:'photos',kick:`${k+1} of 3`,title:'Patterns',th:'ลวดลาย',lead:['Patterns for boxes, bags, posts and the app, in your colours. Pick up to three.','ลวดลายสำหรับกล่อง ถุง โพสต์ และแอป ในสีของคุณ เลือกได้สูงสุด 3 แบบ'],body:cur=>`<div class="grid c3 patg">${PATTERNS.slice(k*6,k*6+6).map(([id,n,th,d])=>card('patterns',id,`<div class="patbox">${patternArt(id,cur.c,380,132)}</div>`,esc(n)+thsmall(th),dsc(d,PATTH[id]),'',true)).join('')}</div>`}));

/* words */
/* tone of voice: one page for each moment, every tone in the same card, so the tones compare side by side */
const MOMICON=['scooter','tiffin','camera'];
function toneCard(t,k,cur){const c=cur.c,L=topLogos(1)[0],mine=arr(ME,'tone').includes(t.id),ln=t.lines[k];
  return `<div class="tcard${mine?' mine':''}${locked('tone',t.id)}" data-set="tone" data-opt="${t.id}"><div class="tnote"><span class="tch"><span class="tci${k===2?' round':''}">${licon(L,c,22)}</span><b>${k===2?'pintobox':'PINTOBOX'}</b><span>${k===2?'post · โพสต์':'now · ตอนนี้'}</span></span><span class="tmsg">${esc(ln[0])}</span><span class="tmsg th">${ln[1]}</span></div><div class="tfoot"><span class="tname"><b>${esc(t.name)}</b> <small class="th">${t.th}</small></span><button type="button" class="me-btn" data-act="pick" aria-pressed="${mine}" aria-label="${mine?'Picked':'Pick'} ${esc(t.name)}">${mine?'✓':'+'}</button></div></div>`}

function optName(set,id){
  const find=(list,key)=>{const x=list.find(o=>(Array.isArray(o)?o[0]:o.id)===id);return x?(Array.isArray(x)?x[key||1]:(x.name||x.en)):id};
  switch(set){
    case 'words':return find(WORDS);
    case 'logo':case 'final':return id==='l0'?'Our logo today':find(LOGOS);
    case 'mascot':return find(MASCOT);
    case 'palette':return id==='own'?'Own colour '+ownHex():find(PALETTES);
    case 'neutral':return find(NEUTRALS);case 'states':return find(STATES);
    case 'arrange':return find(ARRANGE);case 'emphasis':return find(EMPHASIS);
    case 'font':return find(FONTS);case 'iconstyle':return find(ICONSTYLES);
    case 'button':return find(BUTTONS);case 'corner':return find(CORNERS);case 'cardstyle':return find(CARDSTYLES);case 'shadow':return find(SHADOWS);case 'tabbar':return find(TABBARS);
    case 'patterns':return find(PATTERNS);case 'photos':return find(DESIGNSTYLES);
    case 'swatch':{const w=SWALL.find(x=>x[0]===id);return w?w[1]+' '+w[0]:'Own colour '+id}
    case 'captions':return find(CAPTIONS);case 'tone':return find(TONES);case 'promise':return find(PROMISES);
    case 'tagline':{const t=TAGLINES.find(o=>o.id===id);return t?t.en+' / '+t.th:id}
    default:return id;
  }
}

function optNameTh(set,id){const L2=(list,key)=>{const x=list.find(o=>(Array.isArray(o)?o[0]:o.id)===id);return x?(Array.isArray(x)?x[key||2]:(x.th||'')):''};
  switch(set){case 'words':return L2(WORDS);case 'logo':case 'final':return id==='l0'?'โลโก้ที่ใช้อยู่ตอนนี้':L2(LOGOS);case 'mascot':return L2(MASCOT);case 'palette':return id==='own'?'สีของคุณเอง':L2(PALETTES);
    case 'neutral':return L2(NEUTRALS);case 'states':return L2(STATES);case 'arrange':return L2(ARRANGE);case 'emphasis':return L2(EMPHASIS);case 'font':return L2(FONTS);case 'iconstyle':return L2(ICONSTYLES);
    case 'button':return L2(BUTTONS);case 'corner':return L2(CORNERS);case 'cardstyle':return L2(CARDSTYLES);case 'shadow':return L2(SHADOWS);case 'tabbar':return L2(TABBARS);case 'patterns':return L2(PATTERNS);case 'photos':return L2(DESIGNSTYLES);
    case 'swatch':{const w=SWALL.find(x=>x[0]===id);return w?(w[2]||''):''}case 'tone':return L2(TONES);case 'promise':return L2(PROMISES);case 'tagline':return L2(TAGLINES);case 'captions':return L2(CAPTIONS);default:return ''}}

function aboutVal(f){const q=ABOUT.find(x=>x[0]===f);const v=(S.about||{})[f];if(!q||!v)return '';const o=q[3].find(x=>x[0]===v);return o?o[1]:v}
function flatAnswers(p){

  return rows}

const ZOOM=(()=>{try{return !!(window.CSS&&CSS.supports&&CSS.supports('zoom','2'))}catch(e){return false}})();
function fit(){
  const deck=document.getElementById('deck'),st=document.getElementById('stage'),ho=document.getElementById('holder'),ctrl=document.getElementById('ctrl');
  const vw=window.innerWidth,vh=window.innerHeight;
  const flow=vw<760||(vh>vw*1.15&&vw<1000);
  deck.classList.toggle('flow',flow);document.body.classList.toggle('flowmode',flow);
  if(flow){st.style.zoom='';st.style.transform='';ho.style.width='';ho.style.height='';return}
  const z=Math.max(.3,Math.min((vw-24)/1280,(vh-ctrl.offsetHeight-24)/720));

}

async function connect(){
  loadLocal();if(!S.rid){S.rid=newRid();saveLocal()}
  if(window.google&&google.script&&google.script.run){MODE='google';render();return}
  if(ENDPOINT){MODE='post';render();return}
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='prev'){go(CUR-1);return}
  if(b.id==='next'){go(CUR+1);return}
  if(b.dataset.go!==undefined&&b.dataset.go!==''){go(+b.dataset.go);return}
  if(b.dataset.ownt){VIEW.ownT=b.dataset.ownt;VIEW.ownCWt=null;render();const nb=document.querySelector('.osw[data-ownt="'+b.dataset.ownt+'"]');if(nb)nb.focus({preventScroll:true});return}
  if(b.id==='worldTog'){VIEW.world=!worldOn();render();return}
  if(b.id==='ownReset'){S.own=Object.assign({},S.own||{},{ov:{}});VIEW.ownT='p';VIEW.ownCWt=null;save();render();return}
  if(b.dataset.pal){const id=b.dataset.pal;if(arr(ME,'palette')[0]!==id){S.me=Object.assign({},S.me||{},{palette:[id]});save();render()}const nb=document.querySelector('.pdot[data-pal="'+id+'"]');if(nb)nb.focus({preventScroll:true});return}
  if(b.dataset.act==='pick'){const host=b.closest('[data-set]');if(!host)return;toggle(ME,host.dataset.set,host.dataset.opt);return}
  if(b.dataset.about){const f=b.dataset.about,v=b.dataset.val;S.about=Object.assign({},S.about||{});S.about[f]=S.about[f]===v?'':v;save();render();return}
  if(b.dataset.view){VIEW.listStyle=b.dataset.view;render();return}
  if(b.dataset.ps){VIEW.phoneStyle=b.dataset.ps;render();return}
  if(b.dataset.layl){VIEW.layL=b.dataset.layl;render();return}
  if(b.id==='sendBtn'){send();return}
  if(b.id==='copy'){const txt=answersText();const box=document.getElementById('copyout');box.value=txt;
    const done=()=>{b.textContent='Copied · คัดลอกแล้ว'},fail=()=>{box.focus();box.select();b.textContent='Select the text and copy it · เลือกข้อความแล้วคัดลอก'};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fail);else fail()}catch(err){fail()}}
});
document.getElementById('jump').addEventListener('change',e=>go(+e.target.value));
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.id==='cwr'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const o=ownCW();o.h+=(e.key==='ArrowLeft'||e.key==='ArrowDown')?-5:5;cwSet(o,true);return}
  if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'||t.tagName==='SELECT'||t.isContentEditable))return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!(t&&t.tagName==='BUTTON'))){e.preventDefault();go(CUR+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(CUR-1)}
  else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(DECK.length-1)}
});
/* the own colour wheel: dragging round the ring sets the hue, and the two sliders set lightness and strength. The page
   updates the preview around the controls and never rebuilds them, so a finger can keep dragging */
function cwSet(o,commit){
  o=cwClamp(o);const hex=cwHex(o),t=VIEW.ownT||'p';
  if(t==='p')S.own=Object.assign({},S.own||{},{cw:o,colour:hex});
  else{VIEW.ownCWt=Object.assign({t},o);S.own=Object.assign({},S.own||{},{ov:Object.assign({},ownOv(),{[t]:hex})})}
  const cur=current(),$=id=>document.getElementById(id),P=ownPalette(ownHex());
  if($('ownprev'))$('ownprev').innerHTML=ownPreview(cur);if($('ownsw'))$('ownsw').innerHTML=ownSwatches();if($('ownmini'))$('ownmini').innerHTML=ownMini(cur);
  if($('cwc'))$('cwc').style.background=hex;if($('ownhex'))$('ownhex').textContent=hex;
  if($('cwk'))$('cwk').setAttribute('style',cwKnob(o.h)+';background:'+hex);
  if($('cwr'))$('cwr').setAttribute('aria-valuenow',String(Math.round(o.h)));
  if($('cwl'))$('cwl').style.background=cwTrack(o,'L');if($('cwc2'))$('cwc2').style.background=cwTrack(o,'C');
  clearTimeout(tmr.k);tmr.k=setTimeout(save,commit?0:400)}
let cwDrag=null;
function cwFromPointer(e){const r=document.getElementById('cwr');if(!r)return;const b=r.getBoundingClientRect();const x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2);if(Math.hypot(x,y)<2)return;let h=Math.atan2(x,-y)*180/Math.PI;if(h<0)h+=360;const o=ownCW();o.h=h;cwSet(o,false)}
document.addEventListener('pointerdown',e=>{const r=e.target&&e.target.closest&&e.target.closest('#cwr');if(!r)return;e.preventDefault();cwDrag=e.pointerId;try{r.setPointerCapture(e.pointerId)}catch(err){}try{r.focus({preventScroll:true})}catch(err){}cwFromPointer(e)});
document.addEventListener('pointermove',e=>{if(cwDrag===null||e.pointerId!==cwDrag)return;cwFromPointer(e)});
const cwEnd=e=>{if(cwDrag===null||e.pointerId!==cwDrag)return;cwDrag=null;save()};
document.addEventListener('pointerup',cwEnd);document.addEventListener('pointercancel',cwEnd);
const tmr={};
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset)return;
  if(t.tagName==='TEXTAREA'&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains('grow'))t.parentNode.dataset.rep=t.value||t.placeholder;
  if(t.dataset.cw){const o=ownCW();o[t.dataset.cw]=(+t.value)/100;cwSet(o,false);return}
  if(t.dataset.cm!==undefined){S.cm=Object.assign({},S.cm||{});S.cm[t.dataset.cm]=t.value;clearTimeout(tmr.c);tmr.c=setTimeout(save,400);return}
  if(t.dataset.own){S.own=Object.assign({},S.own||{});S.own[t.dataset.own]=t.value;clearTimeout(tmr.o);tmr.o=setTimeout(save,400);return}
  if(t.dataset.abouttext){S.about=Object.assign({},S.about||{});S.about[t.dataset.abouttext]=t.value;clearTimeout(tmr.a);tmr.a=setTimeout(save,400);return}
});
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.cw)save()});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&!e.isComposing&&t&&t.tagName==='TEXTAREA'&&t.dataset.one!==undefined){e.preventDefault();t.blur()}});
window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{const h=parseInt(String(location.hash||'').replace('#',''),10);if(h>0&&h-1!==CUR)go(h-1)});
try{if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const a=document.activeElement;if(!a||a===document.body)render()})}catch(e){}

buildJump();fit();render();connect();
})();
</script>
</body></html>
